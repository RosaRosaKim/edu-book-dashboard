<style>
  body { background: #fff7ee; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(45,138,126,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,138,126,.04) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  .toggle-track { transition: background-color .2s; }
  .toggle-thumb { transition: transform .2s; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .fade-in { animation: fadeIn .35s ease; }
  @keyframes mascotOut { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(40px) scale(.7); } }
  @keyframes mascotIn  { from { opacity:0; transform:translateY(40px) scale(.7); } to { opacity:1; transform:translateY(0) scale(1); } }
  .mascot-out { animation: mascotOut .3s ease forwards; }
  .mascot-in  { animation: mascotIn  .3s ease forwards; }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }
  .pulse-dot { animation: pulse-dot 1.2s infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin .7s linear infinite; }
  /* status pill */
  .pill { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:500; white-space:nowrap; }
  .pill::before { content:''; width:5px; height:5px; border-radius:50%; }
  .pill-ok   { background:rgba(5,150,105,.12); color:#059669; }  .pill-ok::before   { background:#059669; }
  .pill-wait { background:rgba(217,119,6,.12); color:#d97706; }  .pill-wait::before { background:#d97706; }
  .pill-reject { background:rgba(220,38,38,.12); color:#dc2626; } .pill-reject::before { background:#dc2626; }
  .pill-pend { background:rgba(185,142,114,.12); color:#b98e72; }  .pill-pend::before { background:#b98e72; }

  /* 스켈레톤 시머 */
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, #e2f5ef 25%, #ccebe2 37%, #e2f5ef 63%);
    background-size: 800px 100%;
    animation: shimmer 1.6s ease infinite;
    border-radius: 6px;
  }

  /* 버튼 로딩 시머 */
  @keyframes btn-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .btn-loading {
    background-image: linear-gradient(90deg, rgba(45,138,126,.85) 0%, rgba(45,138,126,1) 40%, rgba(75,168,156,.95) 50%, rgba(45,138,126,1) 60%, rgba(45,138,126,.85) 100%) !important;
    background-size: 200% 100%;
    animation: btn-shimmer 1.8s ease infinite;
  }

  /* 모바일 카드 뷰 */
  .record-card { display:none; }
  @media(max-width:640px) {
    .record-table-wrap { display:none !important; }
    .record-card { display:block; }
  }
</style>

<script>
(() => {
'use strict';

/* ─── 상수 ─── */
const API_URL = 'https://script.google.com/macros/s/AKfycby8_T37FXsohyVrIKStEIaV2DYenigsBb8WQ4OPI1FTroQRPCFZKOo5g7cdG9BfGqCO/exec';
const LIMIT = 500000;
const TOKEN_KEY = 'edu_token';
const AUTH_SESSION_KEY = 'edu_auth_session';

/* ─── 상태 ─── */
let timerInterval = null;
let timerSec = 180;
let currentKnoxId = '';

/* ─── 인증 세션 헬퍼 (Flow 앱 재진입 대응) ─── */
function saveAuthSession(knoxId) {
  const data = { knoxId, expiresAt: Date.now() + 180000 };
  localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(data));
}
function loadAuthSession() {
  try {
    const raw = localStorage.getItem(AUTH_SESSION_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (Date.now() > data.expiresAt) { clearAuthSession(); return null; }
    return data;
  } catch { clearAuthSession(); return null; }
}
function clearAuthSession() {
  localStorage.removeItem(AUTH_SESSION_KEY);
}
let userInfo = null;
let records = [];

/* ─── DOM ─── */
const $ = id => document.getElementById(id);

/* ─── 마스코트 애니메이션 헬퍼 ─── */
function mascotHide() {
  const m = $('mascotImg');
  m.classList.remove('mascot-in');
  m.classList.add('mascot-out');
}
function mascotShow() {
  const m = $('mascotImg');
  m.classList.remove('mascot-out');
  m.classList.add('mascot-in');
}

/* ─── 버튼 로딩 헬퍼 ─── */
const SPINNER_SVG = '<svg class="w-4 h-4 spinner" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="32" stroke-dashoffset="12"/></svg>';
function setBtnLoading(btn, loading, label) {
  btn.disabled = loading;
  if (loading) {
    btn.innerHTML = `<span class="inline-flex items-center justify-center gap-2">${SPINNER_SVG}${label}</span>`;
    btn.classList.add('btn-loading');
  } else {
    btn.textContent = label;
    btn.classList.remove('btn-loading');
  }
}

/* ─── GAS fetch 래퍼 (redirect 대응) ─── */
async function gasFetch(url) {
  console.log('[gasFetch] 요청:', url);
  let res;
  try {
    res = await fetch(url, { redirect: 'follow', credentials: 'omit' });
  } catch (e) {
    console.error('[gasFetch] fetch 실패 (네트워크/CORS):', e.message);
    throw e;
  }
  console.log('[gasFetch] 응답:', res.status, res.url);
  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch (e) {
    console.error('[gasFetch] JSON 파싱 실패:', res.status, text.substring(0, 500));
    throw new Error('PARSE_ERROR');
  }
}

/* ═══════════════ 초기화 ═══════════════ */
function init() {
  // URL 파라미터에 token이 있으면 저장 후 URL에서 제거 (보안)
  const params = new URLSearchParams(window.location.search);
  const urlToken = params.get('token');
  if (urlToken) {
    localStorage.setItem(TOKEN_KEY, urlToken);
    window.history.replaceState({}, document.title, window.location.pathname);
  }

  const token = localStorage.getItem(TOKEN_KEY);
  if (token) {
    showDashboard();
    loadDashboard();
  } else {
    // Flow 앱 재진입: 인증 세션이 살아있으면 Step2 복원
    const session = loadAuthSession();
    if (session) {
      currentKnoxId = session.knoxId;
      showAuth();
      $('authStep1').classList.add('hidden');
      $('authStep2').classList.remove('hidden');
      $('resendBtn').classList.add('hidden');
      $('verifyBtn').disabled = false;
      const remainSec = Math.max(Math.floor((session.expiresAt - Date.now()) / 1000), 0);
      if (remainSec > 0) {
        startTimer(remainSec);
      } else {
        updateTimerDisplay();
        $('verifyBtn').disabled = true;
        $('resendBtn').classList.remove('hidden');
      }
    } else {
      showAuth();
    }
  }
}

/* ═══════════════ 인증 흐름 ═══════════════ */
function showAuth() {
  $('authScreen').classList.remove('hidden');
  $('dashboard').classList.add('hidden');
}

function showDashboard() {
  $('authScreen').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
}

/* Step1 → Step2 */
window.requestAuth = async function() {
  const knoxId = $('knoxInput').value.trim();
  if (!knoxId) { showAuthError(1, 'FlowID를 입력해 주세요.'); return; }

  const btn = $('authReqBtn');
  setBtnLoading(btn, true, '요청 중...');
  hideAuthError(1);
  mascotHide();
  $('authReqGif').classList.remove('hidden');

  try {
    const fullKnoxId = knoxId;
    const data = await gasFetch(`${API_URL}?action=sendCode&knoxId=${encodeURIComponent(fullKnoxId)}`);

    if (data.status === 'success') {
      currentKnoxId = fullKnoxId;
      saveAuthSession(fullKnoxId);
      $('authStep1').classList.add('hidden');
      $('authStep2').classList.remove('hidden');
      $('resendBtn').classList.add('hidden');
      $('verifyBtn').disabled = false;
      startTimer();
    } else {
      showAuthError(1, data.error || data.message || '인증 요청에 실패했어요.');
    }
  } catch (e) {
    console.error('인증 요청 오류:', e);
    showAuthError(1, '서버 연결에 실패했어요. 잠시 후 다시 시도해주세요.');
  } finally {
    setBtnLoading(btn, false, '인증 요청');
    $('authReqGif').classList.add('hidden');
    mascotShow();
  }
};

/* 인증번호 재전송 */
window.resendCode = async function() {
  const btn = $('resendBtn');
  setBtnLoading(btn, true, '재전송 중...');
  hideAuthError(2);

  try {
    const data = await gasFetch(`${API_URL}?action=sendCode&knoxId=${encodeURIComponent(currentKnoxId)}`);

    if (data.status === 'success') {
      saveAuthSession(currentKnoxId);
      btn.classList.add('hidden');
      $('verifyBtn').disabled = false;
      $('codeInput').value = '';
      startTimer();
      showToast('인증번호가 재전송되었어요.');
    } else {
      showAuthError(2, data.error || data.message || '재전송에 실패했어요.');
    }
  } catch (e) {
    showAuthError(2, '서버 연결에 실패했어요.');
  } finally {
    setBtnLoading(btn, false, '인증번호 재전송');
  }
};

/* 인증번호 확인 */
window.verifyCode = async function() {
  const code = $('codeInput').value.trim();
  if (code.length !== 6) { showAuthError(2, '6자리 인증번호를 입력해주세요.'); return; }

  const btn = $('verifyBtn');
  setBtnLoading(btn, true, '확인 중...');
  hideAuthError(2);
  mascotHide();
  $('verifyGif').classList.remove('hidden');

  try {
    const data = await gasFetch(`${API_URL}?action=verify&knoxId=${encodeURIComponent(currentKnoxId)}&authCode=${encodeURIComponent(code)}`);

    if (data.status === 'success' && data.token) {
      clearInterval(timerInterval);
      clearAuthSession();
      localStorage.setItem(TOKEN_KEY, data.token);
      showDashboard();
      loadDashboard();
    } else {
      showAuthError(2, data.error || data.message || '인증번호가 다르네요.');
    }
  } catch (e) {
    showAuthError(2, '서버 연결에 실패했어요. 잠시 후 다시 시도해주세요.');
  } finally {
    setBtnLoading(btn, false, '확인');
    $('verifyGif').classList.add('hidden');
    mascotShow();
  }
};

/* 3분 타이머 */
function startTimer(resumeSec) {
  timerSec = resumeSec || 180;
  clearInterval(timerInterval);
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerSec--;
    if (timerSec <= 0) {
      clearInterval(timerInterval);
      $('verifyBtn').disabled = true;
      $('resendBtn').classList.remove('hidden');
    }
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timerSec / 60);
  const s = timerSec % 60;
  const display = $('timerDisplay');
  display.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if (timerSec <= 30) display.classList.add('text-danger');
  else display.classList.remove('text-danger');
}

window.backToStep1 = function() {
  clearInterval(timerInterval);
  $('authStep2').classList.add('hidden');
  $('authStep1').classList.remove('hidden');
  $('codeInput').value = '';
  hideAuthError(2);
};

function showAuthError(step, msg) {
  const el = $(`authError${step}`);
  el.textContent = msg;
  el.classList.remove('hidden');
}
function hideAuthError(step) {
  $(`authError${step}`).classList.add('hidden');
}

/* ═══════════════ 대시보드 로드 ═══════════════ */
async function loadDashboard() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) { showAuth(); return; }

  $('loadingState').classList.remove('hidden');
  $('danceOverlay').classList.remove('hidden');
  $('dashContent').classList.add('hidden');
  $('errorState').classList.add('hidden');

  try {
    const data = await gasFetch(`${API_URL}?token=${encodeURIComponent(token)}`);

    if (data.error) {
      if (data.error === 'UNAUTHORIZED' || data.error === 'INVALID_TOKEN' || data.error === 'TOKEN_EXPIRED') {
        localStorage.removeItem(TOKEN_KEY);
        showAuth();
        return;
      }
      throw new Error(data.error);
    }

    userInfo = data.userInfo || {};
    records = data.myHistory || [];
    renderDashboard();

    $('loadingState').classList.add('hidden');
    $('danceOverlay').classList.add('hidden');
    $('dashContent').classList.remove('hidden');
  } catch (e) {
    $('loadingState').classList.add('hidden');
    $('danceOverlay').classList.add('hidden');
    $('errorState').classList.remove('hidden');
    $('errorMsg').textContent = e.message || '데이터를 불러올 수 없어요.';
  }
}
window.loadDashboard = loadDashboard;

/* ═══════════════ 렌더링 ═══════════════ */
function renderDashboard() {
  // 인사말
  const name = userInfo.name || '';
  $('userGreeting').textContent = name ? `${name}님` : '';

  // 관리자 버튼 (로그아웃 왼쪽)
  if (userInfo.isAdmin && !document.getElementById('adminLink')) {
    const logoutBtn = $('userGreeting').parentElement.querySelector('button[onclick="logout()"]');
    const link = document.createElement('a');
    link.id = 'adminLink';
    link.href = 'dev-admin-dashboard.html';
    link.className = 'text-xs text-[#47635f] border border-[#ccebe2] rounded-lg px-3 py-1.5 hover:bg-[#e2f5ef] hover:text-[#47635f] transition';
    link.textContent = '관리자';
    logoutBtn.parentElement.insertBefore(link, logoutBtn);
  }

  // 금액 계산 — API에서 확정(완료) 금액을 제공, 나머지는 레코드에서 계산
  const confirmedSum = userInfo.usedBudget || 0;
  let pendingSum = 0;
  records.forEach(r => {
    const amt = Number(r.cost) || 0;
    const status = (r.status || '').trim();
    if (status !== '완료' && status !== '반려') pendingSum += amt;
  });

  const usedTotal = confirmedSum + pendingSum;
  const remain = userInfo.remainingBudget != null ? userInfo.remainingBudget : Math.max(LIMIT - confirmedSum, 0);
  const confirmedPct = Math.min((confirmedSum / LIMIT) * 100, 100);
  const pendingPct = Math.min((pendingSum / LIMIT) * 100, 100 - confirmedPct);

  $('usedAmount').textContent = formatMoney(confirmedSum) + '원';
  $('usedSub').textContent = pendingSum > 0 ? `진행중 ${formatMoney(pendingSum)}원 포함 시 총 ${formatMoney(usedTotal)}원` : '';
  $('remainAmount').textContent = formatMoney(remain) + '원';

  // 프로그레스 바
  requestAnimationFrame(() => {
    $('barDone').style.width = confirmedPct + '%';
    $('barPend').style.left = confirmedPct + '%';
    $('barPend').style.width = pendingPct + '%';
  });

  // 알람 토글
  setToggleState(!!userInfo.isAgreed);

  // 테이블 + 카드
  renderRecords();
}

function renderRecords() {
  const body = $('recordsBody');
  const cards = $('recordsCards');
  body.innerHTML = '';
  cards.innerHTML = '';

  if (records.length === 0) {
    $('recordsTable').parentElement.style.display = 'none';
    cards.style.display = 'none';
    $('noRecords').classList.remove('hidden');
    return;
  }

  $('recordsTable').parentElement.style.display = '';
  $('noRecords').classList.add('hidden');

  records.forEach((r, i) => {
    const status = (r.status || '').trim();
    const pillClass = statusPillClass(status);
    const amt = Number(r.cost) || 0;
    const title = r.courseName || '-';
    const period = r.period || '';

    // 데스크탑 테이블 행
    const tr = document.createElement('tr');
    tr.className = 'border-b border-border/80 hover:bg-accent-light transition';
    tr.innerHTML = `
      <td class="px-4 py-3 text-sm text-[#6e7f7b] font-mono">${i + 1}</td>
      <td class="px-4 py-3 text-sm text-[#6e7f7b] whitespace-nowrap">${escapeHtml(r.period || '')}</td>
      <td class="px-4 py-3 text-sm">${escapeHtml(title)}</td>
      <td class="px-4 py-3 text-sm text-right font-mono font-medium">${formatMoney(amt)}원</td>
      <td class="px-4 py-3 text-center"><span class="pill ${pillClass}">${escapeHtml(status || '-')}</span></td>
    `;
    body.appendChild(tr);

    // 모바일 카드
    const card = document.createElement('div');
    card.className = 'bg-surface-2 border border-border/60 rounded-xl p-4';
    card.innerHTML = `
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-semibold">${escapeHtml(title)}</span>
        <span class="pill ${pillClass}">${escapeHtml(status || '-')}</span>
      </div>
      <div class="flex items-center justify-between text-xs text-[#6e7f7b]">
        <span>${escapeHtml(r.period || '')}</span>
        <span class="font-mono font-medium text-[#47635f]">${formatMoney(amt)}원</span>
      </div>
    `;
    cards.appendChild(card);
  });
}

function statusPillClass(status) {
  switch (status) {
    case '완료': case '승인': return 'pill-ok';
    case '반려': return 'pill-reject';
    case '결재중': case '대기': case '진행': case '진행중': return 'pill-wait';
    default: return 'pill-pend';
  }
}

/* ═══════════════ 알람 토글 ═══════════════ */
function setToggleState(on) {
  const el = $('alarmToggle');
  if (on) {
    el.style.setProperty('--toggle-bg', '#059669');
    el.style.setProperty('--toggle-x', 'translateX(20px)');
  } else {
    el.style.setProperty('--toggle-bg', '#ccebe2');
    el.style.setProperty('--toggle-x', 'translateX(0)');
  }
  el.dataset.on = on ? '1' : '0';
}

function setToggleLoading(loading) {
  const el = $('alarmToggle');
  const thumb = el.querySelector('.toggle-thumb');
  el.dataset.loading = loading ? '1' : '0';
  el.style.opacity = loading ? '0.7' : '1';
  if (loading) {
    thumb.innerHTML = '<svg class="w-3.5 h-3.5 spinner text-accent" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="32" stroke-dashoffset="12"/></svg>';
    thumb.style.display = 'flex';
    thumb.style.alignItems = 'center';
    thumb.style.justifyContent = 'center';
  } else {
    thumb.innerHTML = '';
    thumb.style.display = '';
  }
}

window.toggleAlarm = async function() {
  const el = $('alarmToggle');
  if (el.dataset.loading === '1') return; // 중복 클릭 방지
  const isOn = el.dataset.on === '1';
  const newVal = !isOn;
  const token = localStorage.getItem(TOKEN_KEY);

  // 즉시 UI 반영 + 로딩 표시
  setToggleState(newVal);
  setToggleLoading(true);

  try {
    const data = await gasFetch(`${API_URL}?action=updateAlarm&token=${encodeURIComponent(token)}&isAgreed=${newVal}`);

    if (data.status !== 'success') {
      setToggleState(isOn); // 롤백
      showAlarmToast('알람 설정 변경에 실패했어요.', true);
    } else {
      showAlarmToast(newVal ? 'Flow 알람 수신이 활성화되었어요.' : 'Flow 알람 수신이 해제되었어요.');
      if (userInfo) userInfo.isAgreed = newVal;
    }
  } catch (e) {
    setToggleState(isOn); // 롤백
    showAlarmToast('서버 연결에 실패했어요.', true);
  } finally {
    setToggleLoading(false);
  }
};

/* ═══════════════ 로그아웃 ═══════════════ */
window.logout = function() {
  localStorage.removeItem(TOKEN_KEY);
  location.reload();
};

/* ═══════════════ 유틸 ═══════════════ */
function formatMoney(n) {
  return Number(n).toLocaleString('ko-KR');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

let alarmToastTimer = null;
function showAlarmToast(msg, isError) {
  const wrap = $('alarmToast');
  const inner = wrap.firstElementChild;
  inner.textContent = msg;
  inner.style.borderColor = isError ? '#dc2626' : '#059669';
  wrap.classList.remove('opacity-0', 'translate-y-[-8px]');
  wrap.classList.add('opacity-100', 'translate-y-0');
  clearTimeout(alarmToastTimer);
  alarmToastTimer = setTimeout(() => {
    wrap.classList.add('opacity-0', 'translate-y-[-8px]');
    wrap.classList.remove('opacity-100', 'translate-y-0');
  }, 2500);
}

function showToast(msg, isError) {
  const t = $('toast');
  t.textContent = msg;
  t.style.borderColor = isError ? '#dc2626' : '#059669';
  t.classList.remove('translate-y-24', 'opacity-0');
  t.classList.add('translate-y-0', 'opacity-100');
  setTimeout(() => {
    t.classList.add('translate-y-24', 'opacity-0');
    t.classList.remove('translate-y-0', 'opacity-100');
  }, 2500);
}

/* ═══════════════ 시작 ═══════════════ */
document.addEventListener('DOMContentLoaded', init);

})();
</script>
</body>
</html>
