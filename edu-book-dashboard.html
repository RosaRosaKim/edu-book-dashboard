<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFlow 서비스 종료 안내</title><link rel="icon" type="image/x-icon" href="img/favicon.ico"><link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png"><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png"><link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png"><meta name="theme-color" content="#d97706"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#fffbeb 0,#fef3c7 100%);color:#78350f}.card{position:relative;overflow:hidden;max-width:460px;width:100%;background:#fffdf7;border:1px solid #fcd34d;border-radius:24px;padding:40px 32px;box-shadow:0 20px 50px rgba(217,119,6,.15);text-align:center;animation:fadeIn .5s ease}.card::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(251,191,36,.25);filter:blur(40px);pointer-events:none}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.mascot{width:96px;height:96px;object-fit:contain;margin:0 auto 20px;display:block}.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#f59e0b;border-radius:9999px;padding:4px 12px;margin-bottom:14px}h1{font-size:22px;font-weight:700;color:#92400e;margin-bottom:14px}p{font-size:14px;line-height:1.7;color:rgba(120,53,15,.85);margin-bottom:8px}p b{color:#b45309}.btn{display:inline-flex;align-items:center;gap:8px;margin-top:28px;padding:13px 28px;border-radius:14px;background:#f59e0b;color:#fff;font-size:15px;font-weight:600;text-decoration:none;box-shadow:0 6px 16px rgba(245,158,11,.35);transition:background .2s,transform .2s}.btn:hover{background:#d97706;transform:translateY(-2px)}.btn svg{width:16px;height:16px}</style></head><body><div class="card"><img class="mascot" src="img/crying.png" alt="BizFlow"><div class="badge">6/15 종료</div><h1>📢 BizFlow 서비스 종료 안내</h1><p>BizFlow는 <b>6월 15일(월)</b> 운영을 종료해.</p><p>이후로는 새 시스템 <b>flowlabs</b>에서 만나자!</p><p>잔액 알림 등 설정 정보는 flowlabs에서 <b>새로 설정</b>해야 해.</p><a class="btn" href="https://158-180-86-191.nip.io/flowlabs" target="_blank" rel="noopener">flowlabs로 이동 <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg></a></div><script>"serviceWorker"in navigator&&navigator.serviceWorker.getRegistrations().then(function(e){e.forEach(function(e){e.unregister()})}),window.caches&&caches.keys&&caches.keys().then(function(e){e.forEach(function(e){caches.delete(e)})})</script></body></html>
