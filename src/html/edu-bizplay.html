<!-- 교육 신청서 작성 (Bizplay 로그인 후 표시) -->
<section id="bizDraftSection" class="mt-4 hidden">
  <div class="bg-surface border border-border rounded-2xl p-5 space-y-4">
    <button onclick="cancelDraft()" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-accent/10 border border-accent/20 text-accent text-xs font-semibold hover:bg-accent/20 transition mb-3">
      <span class="text-sm">&larr;</span> 돌아가기
    </button>
    <div class="text-[10px] font-bold text-[#6e7f7b] uppercase tracking-[1.5px]">✏️ 교육 신청서 작성</div>

    <!-- 자동입력 (읽기전용) -->
    <div class="grid grid-cols-3 gap-2 hidden">
      <div>
        <label class="text-[10px] text-[#6e7f7b] block mb-1">부서</label>
        <input id="draftDept" type="text" readonly
          class="w-full px-3 py-2 text-sm border border-border rounded-lg bg-surface-2 text-[#6e7f7b]">
      </div>
      <div>
        <label class="text-[10px] text-[#6e7f7b] block mb-1">사번</label>
        <input id="draftEmpNo" type="text" readonly
          class="w-full px-3 py-2 text-sm border border-border rounded-lg bg-surface-2 text-[#6e7f7b]">
      </div>
      <div>
        <label class="text-[10px] text-[#6e7f7b] block mb-1">이름</label>
        <input id="draftName" type="text" readonly
          class="w-full px-3 py-2 text-sm border border-border rounded-lg bg-surface-2 text-[#6e7f7b]">
      </div>
    </div>

    <!-- 교육과정명 -->
    <div>
      <label class="text-[10px] text-[#6e7f7b] block mb-1">교육과정명 <span class="text-danger">*</span></label>
      <input id="draftCourse" type="text" placeholder="교육과정명 입력"
        class="w-full px-3 py-2.5 text-sm border border-border rounded-lg bg-[var(--card-bg)] focus:border-accent focus:outline-none transition">
    </div>

    <!-- 교육기간 -->
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[10px] text-[#6e7f7b] block mb-1">교육 시작일 <span class="text-danger">*</span></label>
        <input id="draftStartDate" type="date"
          class="w-full px-3 py-2.5 text-sm border border-border rounded-lg bg-[var(--card-bg)] focus:border-accent focus:outline-none transition">
      </div>
      <div>
        <label class="text-[10px] text-[#6e7f7b] block mb-1">교육 종료일 <span class="text-danger">*</span></label>
        <input id="draftEndDate" type="date"
          class="w-full px-3 py-2.5 text-sm border border-border rounded-lg bg-[var(--card-bg)] focus:border-accent focus:outline-none transition">
      </div>
    </div>

    <!-- 교육기관 -->
    <div>
      <label class="text-[10px] text-[#6e7f7b] block mb-1">교육기관 <span class="text-danger">*</span></label>
      <input id="draftInstitution" type="text" placeholder="교육기관 입력"
        class="w-full px-3 py-2.5 text-sm border border-border rounded-lg bg-[var(--card-bg)] focus:border-accent focus:outline-none transition">
    </div>

    <!-- 교육구분 (세그먼트) -->
    <div>
      <label class="text-[10px] text-[#6e7f7b] block mb-1">교육구분 <span class="text-danger">*</span></label>
      <div class="seg-group flex rounded-lg border border-border bg-surface-2 p-0.5 mt-1">
        <label class="seg-item flex-1">
          <input type="radio" name="draftEduType" value="온라인" checked class="sr-only">
          <span class="seg-label">온라인</span>
        </label>
        <label class="seg-item flex-1">
          <input type="radio" name="draftEduType" value="오프라인" class="sr-only">
          <span class="seg-label">오프라인</span>
        </label>
        <label class="seg-item flex-1">
          <input type="radio" name="draftEduType" value="구독(ex. chatGPT, 스픽 등)" class="sr-only">
          <span class="seg-label">구독</span>
        </label>
      </div>
    </div>

    <!-- 교육 목적 및 내용 -->
    <div>
      <label class="text-[10px] text-[#6e7f7b] block mb-1">교육 목적 및 내용 <span class="text-danger">*</span></label>
      <textarea id="draftPurpose" rows="3" placeholder="교육 목적 및 내용을 입력해줘"
        class="w-full px-3 py-2.5 text-sm border border-border rounded-lg bg-[var(--card-bg)] focus:border-accent focus:outline-none transition resize-y"></textarea>
    </div>

    <!-- 금액 + 잔액 -->
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[10px] text-[#6e7f7b] block mb-1">금액 (원) <span class="text-danger">*</span></label>
        <input id="draftCost" type="text" inputmode="numeric" placeholder="0"
          oninput="this.value=this.value.replace(/[^0-9]/g,''); if(this.value) this.value=Number(this.value).toLocaleString('ko-KR'); checkBudget()"
          class="w-full px-3 py-2.5 text-sm border border-border rounded-lg bg-[var(--card-bg)] focus:border-accent focus:outline-none transition font-mono">
      </div>
      <div>
        <label class="text-[10px] text-[#6e7f7b] block mb-1">현재 잔액</label>
        <div id="draftRemainDisplay"
          class="w-full px-3 py-2.5 text-sm border border-border rounded-lg bg-surface-2 font-mono text-[#47635f] font-medium">0원</div>
      </div>
    </div>
    <div id="draftOverBudget" class="hidden text-xs text-danger -mt-2">잔액을 초과해서 신청할 수 없어.</div>

    <!-- 비용 청구 방식 (세그먼트) -->
    <div>
      <label class="text-[10px] text-[#6e7f7b] block mb-1">비용 청구 방식 <span class="text-danger">*</span></label>
      <div class="seg-group flex rounded-lg border border-border bg-surface-2 p-0.5 mt-1" style="max-width:200px;">
        <label class="seg-item flex-1">
          <input type="radio" name="draftBilling" value="1회" checked class="sr-only">
          <span class="seg-label">1회</span>
        </label>
        <label class="seg-item flex-1">
          <input type="radio" name="draftBilling" value="월별" class="sr-only">
          <span class="seg-label">월별</span>
        </label>
      </div>
    </div>

    <!-- 비고 -->
    <div>
      <label class="text-[10px] text-[#6e7f7b] block mb-1">비고</label>
      <input id="draftRemark" type="text" placeholder="비고 (선택)"
        class="w-full px-3 py-2.5 text-sm border border-border rounded-lg bg-[var(--card-bg)] focus:border-accent focus:outline-none transition">
    </div>

    <!-- 임시저장 + 결재요청 -->
    <div class="grid grid-cols-2 gap-2">
      <button onclick="submitBizDraft('1')" id="draftSaveBtn"
        class="py-2.5 rounded-lg bg-[#6e7f7b] text-white text-sm font-semibold hover:brightness-110 transition disabled:opacity-40 disabled:cursor-not-allowed">💾 Bizplay 임시저장</button>
      <button onclick="submitBizDraft('2')" id="draftSubmitBtn"
        class="py-2.5 rounded-lg bg-accent text-white text-sm font-semibold hover:brightness-110 transition disabled:opacity-40 disabled:cursor-not-allowed">📨 Bizplay 결재요청</button>
    </div>
    <div id="draftResult" class="hidden text-xs text-center"></div>
  </div>
</section>

<script>
/* ═══════════════ Bizplay 모듈 ═══════════════
 * 부모(dev-edu-book-dashboard.html)에서 제공하는 전역:
 *   $ (id→element), API_URL, TOKEN_KEY, gasFetch, setBtnLoading, showToast,
 *   records (신청 내역 배열)
 */
(() => {
'use strict';

let bizSession = null;

/* ─── 폼에서 위자드로 돌아가기 ─── */
function cancelDraft() {
  $('bizDraftSection').classList.add('hidden');
  if (window.resetWizard) window.resetWizard();
}
window.cancelDraft = cancelDraft;

/* ─── 신청 폼 표시 (hidden 필드만 세팅, 폼은 숨김 유지) ─── */
function showDraftForm() {
  if (!bizSession) return;
  $('draftDept').value = bizSession.deptShort || bizSession.deptNm || '';
  $('draftEmpNo').value = (bizSession.userId || '').split('@')[0];
  $('draftName').value = bizSession.userName || '';
}


/* ─── 위자드에서 기록 선택 시 폼 채움 ─── */
function selectRecord(idx) {
  if (!records[idx]) return;
  const r = records[idx];

  // 교육과정명 (접두어 제거)
  let name = r.courseName || '';
  name = name.replace(/^\[(교육|도서)\]\s*/, '');
  $('draftCourse').value = name;

  // 금액
  const cost = Number(r.cost) || 0;
  $('draftCost').value = cost ? cost.toLocaleString('ko-KR') : '';

  // 날짜: 오늘 ~ +30일
  const today = new Date();
  const end = new Date(today);
  end.setDate(end.getDate() + 30);
  const fmt = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  $('draftStartDate').value = fmt(today);
  $('draftEndDate').value = fmt(end);

  // 교육기관
  if (r.institution) $('draftInstitution').value = r.institution;

  // 교육구분 (라디오)
  if (r.eduType) {
    document.querySelectorAll('input[name="draftEduType"]').forEach(radio => {
      if (radio.value === r.eduType || r.eduType.includes(radio.value)) radio.checked = true;
    });
  }

  // 교육 목적 및 내용
  if (r.purpose) $('draftPurpose').value = r.purpose;

  // 비용 청구 방식 (라디오)
  if (r.billing) {
    document.querySelectorAll('input[name="draftBilling"]').forEach(radio => {
      if (radio.value === r.billing) radio.checked = true;
    });
  }

  // 비고
  if (r.remark) $('draftRemark').value = r.remark;

  // 위자드 숨김 → 폼 표시
  const wiz = $('wizardSection');
  if (wiz) wiz.classList.add('hidden');
  $('bizDraftSection').classList.remove('hidden');
  updateRemainDisplay();
  checkBudget();
  $('bizDraftSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(() => showToast('내역이 폼에 복사됐어!', 'smail', $('bizDraftSection')), 400);
}
window.selectRecord = selectRecord;

/* ─── 교육비 탭 진입 시 approval SSO (weAuth 호출) ─── */
let _eduSsoLoading = false;
async function refreshEduSession() {
  if (_eduSsoLoading) return;
  const token = localStorage.getItem(TOKEN_KEY);
  const sess = JSON.parse(localStorage.getItem('bizplay_session') || 'null');
  if (!token || !sess) return; // Bizplay 미로그인 시 스킵
  _eduSsoLoading = true;
  try {
    const params = new URLSearchParams({ action: 'bizplayEduInit', token: token });
    const data = await gasFetch(`${API_URL}?${params.toString()}`);
    if (data.debug) console.log('[eduInit] debug:', JSON.stringify(data.debug, null, 2));
    if (data.status === 'success') {
      console.log('[eduInit] Approval SSO 완료', data.deptCd ? `(부서: ${data.deptCd})` : '');
    } else {
      console.warn('[eduInit]', data.message || data.error);
    }
  } catch (err) {
    console.warn('[eduInit] 네트워크 오류:', err.message);
  } finally {
    _eduSsoLoading = false;
  }
}
window.refreshEduSession = refreshEduSession;

/* ─── 잔액 표시 & 초과 검증 ─── */
function updateRemainDisplay() {
  const el = $('draftRemainDisplay');
  if (!el) return;
  const remain = window.remainBudget || 0;
  el.textContent = remain.toLocaleString('ko-KR') + '원';
}

function checkBudget() {
  const costRaw = ($('draftCost').value || '').replace(/,/g, '').trim();
  const cost = Number(costRaw) || 0;
  const remain = window.remainBudget || 0;
  const over = cost > 0 && cost > remain;
  const warn = $('draftOverBudget');
  const saveBtn = $('draftSaveBtn');
  const submitBtn = $('draftSubmitBtn');
  if (warn) warn.classList.toggle('hidden', !over);
  if (saveBtn) saveBtn.disabled = over;
  if (submitBtn) submitBtn.disabled = over;
}
window.checkBudget = checkBudget;

/* ─── 임시저장/결재요청 ─── */
async function submitBizDraft(procGb) {
  procGb = procGb || '1';
  const courseName = $('draftCourse').value.trim();
  const startDate = $('draftStartDate').value;
  const endDate = $('draftEndDate').value;
  const institution = $('draftInstitution').value.trim();
  const purpose = $('draftPurpose').value.trim();
  const costRaw = $('draftCost').value.replace(/,/g, '').trim();
  const eduType = document.querySelector('input[name="draftEduType"]:checked')?.value || '온라인';
  const billing = document.querySelector('input[name="draftBilling"]:checked')?.value || '1회';
  const remark = $('draftRemark').value.trim();

  // 잔액 초과 검증
  const costNum = Number(costRaw) || 0;
  const remain = window.remainBudget || 0;
  if (costNum > remain) { showDraftResult('잔액을 초과해서 신청할 수 없어.', false); return; }

  if (!courseName) { showDraftResult('교육과정명을 입력해줘.', false); return; }
  if (!startDate || !endDate) { showDraftResult('교육기간을 입력해줘.', false); return; }
  if (!institution) { showDraftResult('교육기관을 입력해줘.', false); return; }
  if (!purpose) { showDraftResult('교육 목적 및 내용을 입력해줘.', false); return; }
  if (!costRaw || costRaw === '0') { showDraftResult('금액을 입력해줘.', false); return; }

  // 결재요청 시 결재라인 확인 팝업
  if (procGb === '2') {
    const btn = $('draftSubmitBtn');
    setBtnLoading(btn, true, '결재라인 조회 중...');
    hideDraftResult();
    try {
      const apprData = await fetchApprLine();
      setBtnLoading(btn, false, '결재요청');
      if (!apprData) return;
      const confirmed = await showApprLinePopup(apprData.apprLine);
      if (!confirmed) return;
    } catch (err) {
      setBtnLoading(btn, false, '결재요청');
      showDraftResult('결재라인 조회 실패: ' + err.message, false);
      showToast('결재라인 조회 실패', 'angry', $('bizDraftSection'));
      return;
    }
  }

  const btn = procGb === '2' ? $('draftSubmitBtn') : $('draftSaveBtn');
  const loadingLabel = procGb === '2' ? '요청 중...' : '저장 중...';
  setBtnLoading(btn, true, loadingLabel);
  hideDraftResult();

  try {
    const token = localStorage.getItem(TOKEN_KEY);
    const params = new URLSearchParams({
      action: 'bizplayDraft',
      token: token,
      procGb: procGb,
      courseName: courseName,
      startDate: startDate,
      endDate: endDate,
      institution: institution,
      eduType: eduType,
      purpose: purpose,
      cost: costRaw,
      billing: billing,
      remark: remark
    });
    const data = await gasFetch(`${API_URL}?${params.toString()}`);

    const successMsg = procGb === '2' ? '결재요청 완료!' : '임시저장 완료!';
    const toastMsg = procGb === '2' ? 'Bizplay 결재요청 완료!' : 'Bizplay 임시저장 완료!';
    if (data.debug) console.log('[bizDraft] debug:', JSON.stringify(data.debug, null, 2));
    if (data.status === 'success') {
      showToast(toastMsg, 'smail', $('bizDraftSection'));
      if (procGb === '2') {
        cancelDraft();
        const goCheck = await showConfirm('결재요청했어! 확인해볼까?');
        if (goCheck && window.switchTab) window.switchTab('draft');
      } else {
        showDraftResult(successMsg, true);
      }
    } else {
      const failMsg = data.message || data.error || (procGb === '2' ? '결재요청 실패' : '임시저장 실패');
      showDraftResult(failMsg, false);
      showToast(failMsg, 'angry', $('bizDraftSection'));
    }
  } catch (err) {
    showDraftResult('네트워크 오류: ' + err.message, false);
  } finally {
    const resetLabel = procGb === '2' ? '결재요청' : '임시저장';
    setBtnLoading(btn, false, resetLabel);
  }
}
window.submitBizDraft = submitBizDraft;

function showDraftResult(msg, success) {
  const el = $('draftResult');
  el.classList.remove('hidden', 'text-edu', 'text-danger');
  el.classList.add(success ? 'text-edu' : 'text-danger');
  el.textContent = msg;
}
function hideDraftResult() {
  $('draftResult').classList.add('hidden');
}

/* ─── 결재라인 조회 ─── */
async function fetchApprLine() {
  const token = localStorage.getItem(TOKEN_KEY);
  const params = new URLSearchParams({ action: 'bizplayApprLine', token: token });
  const data = await gasFetch(`${API_URL}?${params.toString()}`);
  if (data.debug) console.log('[apprLine] debug:', JSON.stringify(data.debug, null, 2));
  if (data.status === 'success') return data;
  const msg = data.message || data.error || '결재라인 조회 실패';
  showDraftResult(msg, false);
  showToast(msg, 'angry', $('bizDraftSection'));
  return null;
}

/* ─── 결재라인용 사용자 캐시 (시트 기반, Bizplay API 불필요) ─── */
let _apprUserCache = null; // [{bizId, name, pos, deptCd, deptNm}, ...]

async function _loadApprUsers() {
  if (_apprUserCache) return;
  try {
    const token = localStorage.getItem(TOKEN_KEY);
    const res = await gasFetch(`${API_URL}?action=bizplayApprUsers&token=${encodeURIComponent(token)}`);
    if (!res || !res.ok || !res.d) return;
    const b64 = res.d.split('').reverse().join('');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const arr = JSON.parse(new TextDecoder().decode(bytes));
    _apprUserCache = arr.map(u => ({
      APPR_USER_ID: u[0], APPR_USER_NM: u[1], APPR_USER_POS_NM: u[2],
      APPR_DEPT_CD: u[3], APPR_DEPT_NM: u[4]
    }));
  } catch (e) { console.warn('[apprUsers] load error:', e.message); }
}

function _searchApprUsersLocal(word) {
  if (!_apprUserCache) return [];
  const w = word.toLowerCase();
  return _apprUserCache.filter(u =>
    (u.APPR_USER_NM || '').toLowerCase().includes(w) ||
    (u.APPR_USER_ID || '').toLowerCase().includes(w) ||
    (u.APPR_DEPT_NM || '').toLowerCase().includes(w)
  ).slice(0, 20);
}

/* ─── 결재라인 팝업 표시 → Promise<apprLine[]|false> ─── */
function showApprLinePopup(apprLine) {
  return new Promise(resolve => {
    const box = $('apprLineBox');
    const content = $('apprLineContent');
    const btnSubmit = $('apprLineSubmit');
    const btnCancel = $('apprLineCancel');
    const overlay = $('apprLineOverlay');
    const btnEditToggle = $('apprLineEditToggle');
    const editView = $('apprLineEditView');
    const searchView = $('apprLineSearchView');
    const addBtnWrap = $('apprLineAddBtnWrap');
    const addBtn = $('apprLineAddBtn');
    const searchBack = $('apprLineSearchBack');
    const searchInput = $('apprLineSearchInput');

    // 내부 상태
    let editableApprLine = JSON.parse(JSON.stringify(apprLine || []));
    let isEditMode = false;
    let searchTimer = null;

    // 사용자 목록 프리로드 (비동기, 팝업 표시와 병행)
    _loadApprUsers();

    // 초기 렌더링 (읽기전용)
    renderApprLine(content, editableApprLine);
    addBtnWrap.classList.add('hidden');
    btnEditToggle.textContent = '수정';
    btnEditToggle.classList.remove('bg-accent/10');
    editView.classList.remove('hidden');
    searchView.classList.add('hidden');
    btnSubmit.disabled = false;
    box.style.display = '';

    // 편집 모드에서 결재자 0명이면 결재요청 비활성화
    function updateSubmitState() {
      const persons = editableApprLine.filter(r => r.APPR_USER_NM && r.APPR_USER_NM.trim());
      btnSubmit.disabled = isEditMode && persons.length === 0;
      btnSubmit.classList.toggle('opacity-40', btnSubmit.disabled);
    }

    function renderCurrent() {
      if (isEditMode) {
        renderApprLineEditable(content, editableApprLine, {
          onRemove(idx) {
            editableApprLine.splice(idx, 1);
            // APPR_ORD 재정렬
            let ord = 1;
            editableApprLine.forEach(r => { if (r.APPR_USER_NM && r.APPR_USER_NM.trim()) r.APPR_ORD = String(ord++); });
            renderCurrent();
          },
          onMoveUp(idx) {
            if (idx <= 0) return;
            [editableApprLine[idx - 1], editableApprLine[idx]] = [editableApprLine[idx], editableApprLine[idx - 1]];
            let ord = 1;
            editableApprLine.forEach(r => { if (r.APPR_USER_NM && r.APPR_USER_NM.trim()) r.APPR_ORD = String(ord++); });
            renderCurrent();
          },
          onMoveDown(idx) {
            if (idx >= editableApprLine.length - 1) return;
            [editableApprLine[idx], editableApprLine[idx + 1]] = [editableApprLine[idx + 1], editableApprLine[idx]];
            let ord = 1;
            editableApprLine.forEach(r => { if (r.APPR_USER_NM && r.APPR_USER_NM.trim()) r.APPR_ORD = String(ord++); });
            renderCurrent();
          }
        });
        addBtnWrap.classList.remove('hidden');
      } else {
        renderApprLine(content, editableApprLine);
        addBtnWrap.classList.add('hidden');
      }
      updateSubmitState();
    }

    // 수정 토글
    function onEditToggle() {
      isEditMode = !isEditMode;
      btnEditToggle.textContent = isEditMode ? '완료' : '수정';
      btnEditToggle.classList.toggle('bg-accent/10', isEditMode);
      renderCurrent();
    }

    // 결재자 추가 → 검색 뷰
    function onAddBtn() {
      editView.classList.add('hidden');
      searchView.classList.remove('hidden');
      btnSubmit.style.display = 'none';
      searchInput.value = '';
      $('apprLineSearchResults').innerHTML = '';
      $('apprLineSearchEmpty').classList.add('hidden');
      $('apprLineSearchLoading').classList.add('hidden');
      searchInput.focus();
    }

    // 검색 → 편집 뷰로 돌아가기
    function onSearchBack() {
      searchView.classList.add('hidden');
      editView.classList.remove('hidden');
      btnSubmit.style.display = '';
      if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
    }

    // 사원 검색 디바운스 (모바일 한글 IME 대응: composing 중 검색 방지)
    let isComposing = false;
    function onCompositionStart() { isComposing = true; }
    function onCompositionEnd() {
      isComposing = false;
      onSearchInput(); // 조합 완료 후 검색 트리거
    }
    function onSearchInput() {
      if (isComposing) return;
      const word = searchInput.value.trim();
      if (searchTimer) clearTimeout(searchTimer);
      if (word.length < 1) {
        $('apprLineSearchResults').innerHTML = '';
        $('apprLineSearchEmpty').classList.add('hidden');
        $('apprLineSearchLoading').classList.add('hidden');
        return;
      }
      searchTimer = setTimeout(() => doSearch(word), 1000);
    }
    function onSearchKeydown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (searchTimer) clearTimeout(searchTimer);
        const word = searchInput.value.trim();
        if (word.length >= 1) doSearch(word);
      }
    }

    function doSearch(word) {
      $('apprLineSearchLoading').classList.add('hidden');
      const results = _searchApprUsersLocal(word);
      if (results.length > 0) {
        renderSearchResults($('apprLineSearchResults'), results, function onAdd(emp) {
          if (editableApprLine.some(r => r.APPR_USER_ID === emp.APPR_USER_ID)) {
            showToast('이미 추가된 결재자야.', 'sad');
            return;
          }
          const persons = editableApprLine.filter(r => r.APPR_USER_NM && r.APPR_USER_NM.trim());
          editableApprLine.push({
            APPR_USER_ID: emp.APPR_USER_ID,
            APPR_USER_NM: emp.APPR_USER_NM,
            APPR_USER_POS_NM: emp.APPR_USER_POS_NM,
            APPR_DEPT_CD: emp.APPR_DEPT_CD,
            APPR_DEPT_NM: emp.APPR_DEPT_NM,
            APPR_ORD: String(persons.length + 1),
            APPR_USER_GB: '2',
            APPRLINE_KIND: '2',
            RECENT_SAVE_YN: 'N',
            BOTTOM_FIXED_YN: 'N',
            DEPT_CD: emp.APPR_DEPT_CD,
            DEPT_NM: emp.APPR_DEPT_NM
          });
          onSearchBack();
          renderCurrent();
        });
        $('apprLineSearchEmpty').classList.add('hidden');
      } else {
        $('apprLineSearchResults').innerHTML = '';
        $('apprLineSearchEmpty').classList.remove('hidden');
      }
    }

    // cleanup
    function cleanup() {
      btnEditToggle.removeEventListener('click', onEditToggle);
      addBtn.removeEventListener('click', onAddBtn);
      searchBack.removeEventListener('click', onSearchBack);
      searchInput.removeEventListener('input', onSearchInput);
      searchInput.removeEventListener('keydown', onSearchKeydown);
      searchInput.removeEventListener('compositionstart', onCompositionStart);
      searchInput.removeEventListener('compositionend', onCompositionEnd);
      btnSubmit.removeEventListener('click', onSubmit);
      btnCancel.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onCancel);
      if (searchTimer) clearTimeout(searchTimer);
      btnSubmit.style.display = '';
      btnSubmit.disabled = false;
      btnSubmit.classList.remove('opacity-40');
    }

    function close(val) {
      box.style.display = 'none';
      cleanup();
      resolve(val);
    }
    function onSubmit() { close(editableApprLine); }
    function onCancel() { close(false); }

    btnEditToggle.addEventListener('click', onEditToggle);
    addBtn.addEventListener('click', onAddBtn);
    searchBack.addEventListener('click', onSearchBack);
    searchInput.addEventListener('input', onSearchInput);
    searchInput.addEventListener('keydown', onSearchKeydown);
    searchInput.addEventListener('compositionstart', onCompositionStart);
    searchInput.addEventListener('compositionend', onCompositionEnd);
    btnSubmit.addEventListener('click', onSubmit);
    btnCancel.addEventListener('click', onCancel);
    overlay.addEventListener('click', onCancel);
  });
}

/* ─── 결재라인 렌더링 (읽기전용) ─── */
function renderApprLine(container, list) {
  if (!list || list.length === 0) {
    container.innerHTML = '<div class="text-sm text-[#6e7f7b] text-center py-4">결재라인 정보가 없습니다.</div>';
    return;
  }

  // 유효한 항목만 필터 (사람+부서 통합)
  const items = list.filter(r => {
    var hasUser = r.APPR_USER_NM && r.APPR_USER_NM.trim();
    var hasDept = (r.APPR_DEPT_NM || r.DEPT_NM || '').trim();
    return hasUser || hasDept;
  });
  // 결재(APPRLINE_KIND !== '4')와 참조(APPRLINE_KIND === '4') 분리
  const apprItems = items.filter(r => r.APPRLINE_KIND !== '4').sort((a, b) => Number(a.APPR_ORD || 0) - Number(b.APPR_ORD || 0));
  const refItems = items.filter(r => r.APPRLINE_KIND === '4').sort((a, b) => Number(a.APPR_ORD || 0) - Number(b.APPR_ORD || 0));

  function renderItem(rec, idx, badgeCls, badgeLabel) {
    const isPerson = rec.APPR_USER_NM && rec.APPR_USER_NM.trim();
    let h = '';
    if (idx > 0) {
      h += '<div class="flex justify-center py-1"><svg class="w-4 h-4 text-[#aab5b2]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg></div>';
    }
    if (isPerson) {
      const name = rec.APPR_USER_NM || '';
      const pos = rec.APPR_USER_POS_NM || '';
      const dept = rec.APPR_DEPT_NM || '';
      h += '<div class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-surface border border-border">'
        + '<div class="w-7 h-7 rounded-full bg-accent/10 flex items-center justify-center text-xs font-bold text-accent shrink-0">' + (idx + 1) + '</div>'
        + '<div class="flex-1 min-w-0">'
        + '<div class="text-sm font-semibold text-[#47635f] truncate">' + name + (pos ? ' <span class="font-normal text-[#6e7f7b]">(' + pos + ')</span>' : '') + '</div>'
        + (dept ? '<div class="text-[11px] text-[#aab5b2] truncate">' + dept + '</div>' : '')
        + '</div>'
        + '<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0 ' + badgeCls + '">' + badgeLabel + '</span>'
        + '</div>';
    } else {
      const deptNm = (rec.APPR_DEPT_NM || rec.DEPT_NM || '').trim();
      h += '<div class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-surface border border-border">'
        + '<div class="w-7 h-7 rounded-full bg-[#6e7f7b]/10 flex items-center justify-center shrink-0">'
        + '<svg class="w-3.5 h-3.5 text-[#6e7f7b]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>'
        + '</div>'
        + '<div class="flex-1 min-w-0">'
        + '<div class="text-sm font-semibold text-[#47635f] truncate">' + deptNm + '</div>'
        + '</div>'
        + '<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0 ' + badgeCls + '">' + badgeLabel + '</span>'
        + '</div>';
    }
    return h;
  }

  let html = '';
  if (apprItems.length > 0) {
    html += '<div class="text-[10px] font-bold text-accent uppercase tracking-[1px] mb-2">결재</div>';
    apprItems.forEach((rec, idx) => { html += renderItem(rec, idx, 'bg-accent/15 text-accent', '결재'); });
  }
  if (refItems.length > 0) {
    if (apprItems.length > 0) html += '<div class="mt-3 pt-3 border-t border-border"></div>';
    html += '<div class="text-[10px] font-bold text-[#6e7f7b] uppercase tracking-[1px] mb-2">참조</div>'
      + '<div class="flex flex-wrap gap-1.5">';
    refItems.forEach(rec => {
      const label = (rec.APPR_USER_NM && rec.APPR_USER_NM.trim()) || (rec.APPR_DEPT_NM || rec.DEPT_NM || '').trim();
      if (label) html += '<span class="text-[11px] px-2 py-1 rounded-lg bg-surface-2 text-[#6e7f7b] border border-border">' + label + '</span>';
    });
    html += '</div>';
  }

  container.innerHTML = html;
}

/* ─── 결재라인 렌더링 (편집모드) ─── */
function renderApprLineEditable(container, list, handlers) {
  if (!list || list.length === 0) {
    container.innerHTML = '<div class="text-sm text-[#6e7f7b] text-center py-4">결재자가 없습니다. 아래 버튼으로 추가해줘.</div>';
    return;
  }

  // 유효한 항목만 필터 (사람+부서 통합)
  const items = list.filter(r => {
    var hasUser = r.APPR_USER_NM && r.APPR_USER_NM.trim();
    var hasDept = (r.APPR_DEPT_NM || r.DEPT_NM || '').trim();
    return hasUser || hasDept;
  });
  // list에서의 실제 인덱스 매핑 (이동/삭제용)
  const realIndices = [];
  list.forEach((r, i) => {
    var hasUser = r.APPR_USER_NM && r.APPR_USER_NM.trim();
    var hasDept = (r.APPR_DEPT_NM || r.DEPT_NM || '').trim();
    if (hasUser || hasDept) realIndices.push(i);
  });

  // 결재 / 참조 분리
  const apprGroup = []; const refGroup = [];
  items.forEach((rec, idx) => {
    const entry = { rec: rec, realIdx: realIndices[idx] };
    if (rec.APPRLINE_KIND === '4') refGroup.push(entry);
    else apprGroup.push(entry);
  });

  function renderEditItem(rec, realIdx, idx, total, badgeCls, badgeLabel) {
    const isPerson = rec.APPR_USER_NM && rec.APPR_USER_NM.trim();
    let h = '';
    if (idx > 0) {
      h += '<div class="flex justify-center py-1"><svg class="w-4 h-4 text-[#aab5b2]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg></div>';
    }
    if (isPerson) {
      const name = rec.APPR_USER_NM || '';
      const pos = rec.APPR_USER_POS_NM || '';
      const dept = rec.APPR_DEPT_NM || '';
      h += '<div class="flex items-center gap-2 px-3 py-2.5 rounded-xl bg-surface border border-border">'
        + '<div class="w-7 h-7 rounded-full bg-accent/10 flex items-center justify-center text-xs font-bold text-accent shrink-0">' + (idx + 1) + '</div>'
        + '<div class="flex-1 min-w-0">'
        + '<div class="text-sm font-semibold text-[#47635f] truncate">' + name + (pos ? ' <span class="font-normal text-[#6e7f7b]">(' + pos + ')</span>' : '') + '</div>'
        + (dept ? '<div class="text-[11px] text-[#aab5b2] truncate">' + dept + '</div>' : '')
        + '</div>'
        + '<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0 ' + badgeCls + '">' + badgeLabel + '</span>'
        + '<div class="flex flex-col gap-0.5 shrink-0">'
        + '<button data-action="up" data-idx="' + realIdx + '" class="w-6 h-6 flex items-center justify-center rounded bg-surface-2 border border-border text-[#6e7f7b] hover:bg-accent/10 hover:text-accent transition' + (idx === 0 ? ' opacity-30 pointer-events-none' : '') + '"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg></button>'
        + '<button data-action="down" data-idx="' + realIdx + '" class="w-6 h-6 flex items-center justify-center rounded bg-surface-2 border border-border text-[#6e7f7b] hover:bg-accent/10 hover:text-accent transition' + (idx === total - 1 ? ' opacity-30 pointer-events-none' : '') + '"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg></button>'
        + '</div>'
        + '<button data-action="remove" data-idx="' + realIdx + '" class="w-6 h-6 flex items-center justify-center rounded bg-red-50 border border-red-200 text-red-400 hover:bg-red-100 hover:text-red-600 transition shrink-0"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>'
        + '</div>';
    } else {
      const deptNm = (rec.APPR_DEPT_NM || rec.DEPT_NM || '').trim();
      h += '<div class="flex items-center gap-2 px-3 py-2.5 rounded-xl bg-surface border border-border">'
        + '<div class="w-7 h-7 rounded-full bg-[#6e7f7b]/10 flex items-center justify-center shrink-0">'
        + '<svg class="w-3.5 h-3.5 text-[#6e7f7b]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>'
        + '</div>'
        + '<div class="flex-1 min-w-0">'
        + '<div class="text-sm font-semibold text-[#47635f] truncate">' + deptNm + '</div>'
        + '</div>'
        + '<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0 ' + badgeCls + '">' + badgeLabel + '</span>'
        + '</div>';
    }
    return h;
  }

  let html = '';
  if (apprGroup.length > 0) {
    html += '<div class="text-[10px] font-bold text-accent uppercase tracking-[1px] mb-2">결재</div>';
    apprGroup.forEach((e, idx) => { html += renderEditItem(e.rec, e.realIdx, idx, apprGroup.length, 'bg-accent/15 text-accent', '결재'); });
  }
  if (refGroup.length > 0) {
    if (apprGroup.length > 0) html += '<div class="mt-3 pt-3 border-t border-border"></div>';
    html += '<div class="text-[10px] font-bold text-[#6e7f7b] uppercase tracking-[1px] mb-2">참조</div>'
      + '<div class="flex flex-wrap gap-1.5">';
    refGroup.forEach(e => {
      const label = (e.rec.APPR_USER_NM && e.rec.APPR_USER_NM.trim()) || (e.rec.APPR_DEPT_NM || e.rec.DEPT_NM || '').trim();
      if (label) html += '<span class="text-[11px] px-2 py-1 rounded-lg bg-surface-2 text-[#6e7f7b] border border-border">' + label + '</span>';
    });
    html += '</div>';
  }

  container.innerHTML = html;

  // 이벤트 위임
  container.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      const idx = parseInt(btn.dataset.idx, 10);
      if (action === 'remove') handlers.onRemove(idx);
      else if (action === 'up') handlers.onMoveUp(idx);
      else if (action === 'down') handlers.onMoveDown(idx);
    });
  });
}

/* ─── 검색 결과 렌더링 ─── */
function renderSearchResults(container, results, onAdd) {
  let html = '';
  results.forEach((emp, idx) => {
    html += '<div class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-surface border border-border">'
      + '<div class="flex-1 min-w-0">'
      + '<div class="text-sm font-semibold text-[#47635f] truncate">' + (emp.APPR_USER_NM || '') + (emp.APPR_USER_POS_NM ? ' <span class="font-normal text-[#6e7f7b]">(' + emp.APPR_USER_POS_NM + ')</span>' : '') + '</div>'
      + (emp.APPR_DEPT_NM ? '<div class="text-[11px] text-[#aab5b2] truncate">' + emp.APPR_DEPT_NM + '</div>' : '')
      + '</div>'
      + '<button data-search-idx="' + idx + '" class="w-7 h-7 flex items-center justify-center rounded-full bg-accent/10 text-accent hover:bg-accent/20 transition shrink-0 cursor-pointer"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg></button>'
      + '</div>';
  });
  container.innerHTML = html;
  container.querySelectorAll('button[data-search-idx]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.searchIdx, 10);
      if (results[i]) onAdd(results[i]);
    });
  });
}
