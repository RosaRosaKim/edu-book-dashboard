<div class="fade-in">
  <div class="bg-surface border border-border rounded-2xl overflow-hidden">
    <div id="draftsCards" class="p-3 space-y-3"></div>
    <div id="draftsLoading" class="hidden p-3 space-y-3">
      <div class="bg-white border border-border rounded-xl p-3.5 space-y-2"><div class="flex items-center justify-between gap-2"><div class="skeleton h-4 w-3/5 rounded"></div><div class="skeleton h-5 w-14 rounded-full"></div></div><div class="flex gap-1.5"><div class="skeleton h-5 w-24 rounded"></div><div class="skeleton h-5 w-28 rounded"></div><div class="skeleton h-5 w-16 rounded"></div></div></div>
      <div class="bg-white border border-border rounded-xl p-3.5 space-y-2"><div class="flex items-center justify-between gap-2"><div class="skeleton h-4 w-2/5 rounded"></div><div class="skeleton h-5 w-14 rounded-full"></div></div><div class="flex gap-1.5"><div class="skeleton h-5 w-28 rounded"></div><div class="skeleton h-5 w-24 rounded"></div></div></div>
      <div class="bg-white border border-border rounded-xl p-3.5 space-y-2"><div class="flex items-center justify-between gap-2"><div class="skeleton h-4 w-1/2 rounded"></div><div class="skeleton h-5 w-14 rounded-full"></div></div><div class="flex gap-1.5"><div class="skeleton h-5 w-20 rounded"></div><div class="skeleton h-5 w-28 rounded"></div><div class="skeleton h-5 w-16 rounded"></div></div></div>
      <div class="bg-white border border-border rounded-xl p-3.5 space-y-2"><div class="flex items-center justify-between gap-2"><div class="skeleton h-4 w-3/4 rounded"></div><div class="skeleton h-5 w-14 rounded-full"></div></div><div class="flex gap-1.5"><div class="skeleton h-5 w-24 rounded"></div><div class="skeleton h-5 w-24 rounded"></div></div></div>
      <div class="bg-white border border-border rounded-xl p-3.5 space-y-2"><div class="flex items-center justify-between gap-2"><div class="skeleton h-4 w-2/5 rounded"></div><div class="skeleton h-5 w-14 rounded-full"></div></div><div class="flex gap-1.5"><div class="skeleton h-5 w-28 rounded"></div><div class="skeleton h-5 w-20 rounded"></div><div class="skeleton h-5 w-16 rounded"></div></div></div>
      <div class="bg-white border border-border rounded-xl p-3.5 space-y-2"><div class="flex items-center justify-between gap-2"><div class="skeleton h-4 w-1/2 rounded"></div><div class="skeleton h-5 w-14 rounded-full"></div></div><div class="flex gap-1.5"><div class="skeleton h-5 w-24 rounded"></div><div class="skeleton h-5 w-28 rounded"></div></div></div>
      <div class="bg-white border border-border rounded-xl p-3.5 space-y-2"><div class="flex items-center justify-between gap-2"><div class="skeleton h-4 w-3/5 rounded"></div><div class="skeleton h-5 w-14 rounded-full"></div></div><div class="flex gap-1.5"><div class="skeleton h-5 w-20 rounded"></div><div class="skeleton h-5 w-28 rounded"></div><div class="skeleton h-5 w-16 rounded"></div></div></div>
      <div class="bg-white border border-border rounded-xl p-3.5 space-y-2"><div class="flex items-center justify-between gap-2"><div class="skeleton h-4 w-2/5 rounded"></div><div class="skeleton h-5 w-14 rounded-full"></div></div><div class="flex gap-1.5"><div class="skeleton h-5 w-28 rounded"></div><div class="skeleton h-5 w-24 rounded"></div></div></div>
    </div>
    <div id="noDrafts" class="hidden text-center py-10 text-[#6e7f7b] text-sm">
      <img src="../img/dance2.gif" alt="empty" class="w-16 h-16 mx-auto mb-3">기안문서가 없어.
    </div>
  </div>
  <div id="draftDetail" class="hidden"></div>
</div>

<script>
(function() {
'use strict';

const $ = window.$;
const API_URL = window.API_URL;
const TOKEN_KEY = window.TOKEN_KEY;
var _draftMap = {};

async function fetchDraftList() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) return;
  const loading = $('draftsLoading');
  const noDrafts = $('noDrafts');
  const cards = $('draftsCards');
  if (loading) loading.classList.remove('hidden');
  if (noDrafts) noDrafts.classList.add('hidden');
  if (cards) cards.innerHTML = '';
  if (window.showLoading) window.showLoading();

  try {
    const params = new URLSearchParams({ action: 'bizplayDraftList', token });
    const data = await window.gasFetch(`${API_URL}?${params}`);
    if (data.debug) console.log('[draftList] debug:', JSON.stringify(data.debug, null, 2));
    if (data.status === 'success') {
      renderDraftList(data.draftList || []);
    } else {
      window.showToast(data.message || '기안문서 조회 실패', 'angry', cards);
    }
  } catch (err) {
    window.showToast('기안문서 조회 실패: ' + err.message, 'angry', cards);
  } finally {
    if (loading) loading.classList.add('hidden');
    if (window.hideLoading) window.hideLoading();
  }
}

function renderDraftList(list) {
  const cards = $('draftsCards');
  const noDrafts = $('noDrafts');
  if (!list || list.length === 0) {
    if (noDrafts) noDrafts.classList.remove('hidden');
    return;
  }
  if (noDrafts) noDrafts.classList.add('hidden');

  // 목록 데이터를 맵에 저장 (상세보기에서 RSLT_MSG 등 활용)
  _draftMap = {};
  list.forEach(function(doc) { if (doc.APPR_SEQ_NO) _draftMap[doc.APPR_SEQ_NO] = doc; });

  const statusInfo = (s) => {
    const st = String(s || '').trim();
    if (st.includes('승인') || st.includes('완료')) return { badge: 'bg-[#e8f5e9] text-[#2e7d32] border border-[#a5d6a7] dark:bg-[#1b3a2a] dark:text-[#6fcf8a] dark:border-[#2e5e3e]', icon: '✓', bar: 'draft-bar-ok', bg: 'draft-bg-ok' };
    if (st.includes('반려') || st.includes('반송')) return { badge: 'bg-[#ffebee] text-[#c62828] border border-[#ef9a9a] dark:bg-[#3a1b1b] dark:text-[#f08080] dark:border-[#5e2e2e]', icon: '✕', bar: 'draft-bar-reject', bg: 'draft-bg-reject' };
    if (st.includes('진행') || st.includes('결재')) return { badge: 'bg-[#e3f2fd] text-[#1565c0] border border-[#90caf9] dark:bg-[#1b2a3a] dark:text-[#6fb3f0] dark:border-[#2e4a5e]', icon: '⏳', bar: 'draft-bar-progress', bg: 'draft-bg-progress' };
    return { badge: 'bg-[#6e7f7b]/10 text-[#6e7f7b] border border-[#6e7f7b]/20', icon: '', bar: 'draft-bar-default', bg: 'draft-bg-default' };
  };

  let html = '';
  list.forEach((doc, idx) => {
    const title = doc.APPR_SUBJ || doc.PAPER_NM || doc.SUBJ || ('문서 ' + (idx + 1));
    const paperNm = doc.PAPER_NM || doc.FORM_NM || '';
    const dttm = doc.DRAFT_DTTM || doc.DRAFT_DATE || doc.REG_DATE || '';
    let dispDate = '';
    if (dttm.length >= 12) {
      dispDate = dttm.substring(0,4) + '-' + dttm.substring(4,6) + '-' + dttm.substring(6,8)
        + ' ' + dttm.substring(8,10) + ':' + dttm.substring(10,12);
    } else if (dttm.length >= 8) {
      dispDate = dttm.substring(0,4) + '-' + dttm.substring(4,6) + '-' + dttm.substring(6,8);
    }
    const status = doc.APPR_STS_NM || doc.PROC_NM || doc.STS_NM || '';
    const si = statusInfo(status);
    const docNo = doc.APPR_NO || doc.DOC_NO || doc.APPR_SEQ_NO || '';
    const amt = doc.TOT_AMT || doc.AMT || '';
    const amtDisp = amt ? Number(String(amt).replace(/,/g, '')).toLocaleString('ko-KR') + '원' : '';
    const apprSeqNo = doc.APPR_SEQ_NO || '';
    const pSeqNo = doc.PAPER_SEQ_NO || '';

    html += '<div class="flex border border-border rounded-xl overflow-hidden cursor-pointer active:scale-[0.98] transition-transform relative ' + si.bg + '" data-draft-card onclick="fetchDraftDetail(\'' + apprSeqNo + '\',\'' + pSeqNo + '\',this)">'
      + '<div class="w-1 shrink-0 rounded-l-xl ' + si.bar + '"></div>'
      + '<div class="flex-1 p-3.5">'
      + '<div class="flex items-start justify-between gap-2 mb-1.5">'
      + '<div class="text-sm font-semibold text-[#47635f] leading-snug flex-1 min-w-0 truncate">' + title + '</div>'
      + (status ? '<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0 ' + si.badge + '">' + (si.icon ? si.icon + ' ' : '') + status + '</span>' : '')
      + '</div>'
      + '<div class="flex flex-wrap items-center gap-1.5 mt-1">'
      + (docNo ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-accent/10 text-accent font-mono font-medium border border-accent/20">' + docNo + '</span>' : '')
      + (paperNm ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-white/80 dark:bg-white/10 text-[#6e7f7b] border border-border">' + paperNm + '</span>' : '')
      + (dispDate ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-white/80 dark:bg-white/10 text-[#6e7f7b] border border-border">기안 ' + dispDate + '</span>' : '')
      + (amtDisp ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-white/80 dark:bg-white/10 text-[#47635f] font-mono font-medium border border-border">' + amtDisp + '</span>' : '')
      + '</div>'
      + '</div>'
      + '</div>';
  });
  cards.innerHTML = html;
}

async function fetchDraftDetail(apprSeqNo, paperSeqNo, cardEl) {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) return;

  // 카드 로딩 오버레이
  let overlay = null;
  if (cardEl) {
    overlay = document.createElement('div');
    overlay.className = 'absolute inset-0 bg-white/70 dark:bg-[#1a1f2e]/70 flex items-center justify-center z-10 rounded-xl';
    overlay.innerHTML = '<svg class="w-5 h-5 spinner text-accent" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="32" stroke-dashoffset="12"/></svg>';
    cardEl.appendChild(overlay);
  }

  try {
    const params = new URLSearchParams({ action: 'bizplayDraftDetail', token, apprSeqNo, paperSeqNo });
    const data = await window.gasFetch(`${API_URL}?${params}`);
    if (data.debug) console.log('[draftDetail] debug:', JSON.stringify(data.debug, null, 2));
    if (data.rawKeys) console.log('[draftDetail] rawKeys:', data.rawKeys);
    if (data.status === 'success') {
      // 목록 데이터 병합 (RSLT_MSG, APPR_STS_NM 등)
      var listItem = _draftMap[apprSeqNo] || {};
      var detail = data.detail;
      if (!detail.APPR_STS_NM && listItem.APPR_STS_NM) detail.APPR_STS_NM = listItem.APPR_STS_NM;
      if (!detail.REJECT_REMARK && listItem.RSLT_MSG) detail.REJECT_REMARK = listItem.RSLT_MSG;
      if (listItem.RSLT_MSG) detail.RSLT_MSG = listItem.RSLT_MSG;
      if (listItem.RECENT_APPR_USER_NM) detail.RECENT_APPR_USER_NM = listItem.RECENT_APPR_USER_NM;
      renderDraftDetail(detail);
    } else {
      window.showToast(data.message || '기안문서 상세 조회 실패', 'angry');
    }
  } catch (err) {
    window.showToast('기안문서 상세 조회 실패: ' + err.message, 'angry');
  } finally {
    if (overlay && overlay.parentNode) overlay.remove();
  }
}

/** Bizplay 결의서(카드영수증) HTML → 모바일 카드 UI 변환 */
function parseDraftHtml(html) {
  if (!html) return html;
  var tmp = document.createElement('div');
  tmp.innerHTML = html;

  // 결의서(카드영수증) 감지
  if (!tmp.querySelector('.cardbill_wrap') && !tmp.querySelector('.expreport_wrap')) {
    return _parseGenericDoc(tmp);
  }

  var out = '';

  // 헤더 (발의자, 발의일자, 제목, 내용)
  var headerTbl = tmp.querySelector('.tbl_input2');
  if (headerTbl) {
    var rows = headerTbl.querySelectorAll('tr');
    out += '<div class="space-y-1.5 mb-3">';
    rows.forEach(function(tr) {
      var th = (tr.querySelector('th') || {}).textContent || '';
      var td = (tr.querySelector('td') || {}).textContent || '';
      th = th.trim(); td = td.trim();
      if (!th || !td) return;
      // 제목/내용은 이미 상단에 표시되므로 발의자/발의일자만
      if (th === '제목' || th === '내용') return;
      out += '<div class="flex gap-2 text-xs"><span class="text-[#6e7f7b] shrink-0 w-14">' + th + '</span><span class="text-[#47635f] font-medium">' + td + '</span></div>';
    });
    out += '</div>';
  }

  // 합계
  var totEl = tmp.querySelector('#totAmt_layer');
  if (totEl) {
    out += '<div class="text-xs font-bold text-[#47635f] bg-surface-2 rounded-lg px-3 py-2 mb-3">' + totEl.textContent.trim() + '</div>';
  }

  // 카드 영수증 항목들
  var wraps = tmp.querySelectorAll('.cardbill_wrap');
  wraps.forEach(function(wrap) {
    var box = wrap.querySelector('.cardbill_box');
    if (!box) return;

    // 가맹점명
    var nameEl = box.querySelector('.left strong');
    var merchant = nameEl ? (nameEl.getAttribute('title') || nameEl.textContent || '').trim() : '';
    // 금액
    var amtEl = box.querySelector('.right strong');
    var amount = amtEl ? amtEl.textContent.trim() : '';
    // 번호 + 날짜
    var numEl = box.querySelector('.state_deduction.nums');
    var num = numEl ? numEl.textContent.trim() : '';
    var firstLi = box.querySelector('.left li');
    var dateText = '';
    if (firstLi) {
      var raw = firstLi.textContent.replace(/\s+/g, ' ').trim();
      var dm = raw.match(/(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2})/);
      if (dm) dateText = dm[1];
    }

    // 지출용도/적요/상세설명 등 (cardtxt_tb)
    var details = [];
    var txtTbl = wrap.querySelector('.cardtxt_tb');
    if (txtTbl) {
      txtTbl.querySelectorAll('tr').forEach(function(tr) {
        var th = (tr.querySelector('th') || {}).textContent || '';
        var tdEl = tr.querySelector('td textarea') || tr.querySelector('td div') || tr.querySelector('td');
        var val = tdEl ? (tdEl.value || tdEl.textContent || '').trim() : '';
        th = th.trim();
        if (!th || !val || th === '제조회계단위') return;
        // 신청금액은 금액과 중복되므로 스킵
        if (th === '신청금액') return;
        details.push({ label: th, value: val });
      });
    }

    // 카드 상세 (card_cont) — 주요 항목만
    var cardInfo = [];
    var contTbl = wrap.querySelector('.card_cont table');
    if (contTbl) {
      contTbl.querySelectorAll('tr').forEach(function(tr) {
        var th = (tr.querySelector('th') || {}).textContent || '';
        var td = (tr.querySelector('td') || {}).textContent || '';
        th = th.trim(); td = td.trim();
        if (!th || !td) return;
        // 가맹점업종, 가맹점주소만 추가 (나머지는 너무 상세)
        if (th === '가맹점업종' || th === '가맹점주소') {
          cardInfo.push({ label: th, value: td });
        }
      });
    }

    out += '<div class="bg-surface-2 border border-border/60 rounded-xl p-3 mb-2">';
    // 상단: 번호 + 가맹점 + 금액
    out += '<div class="flex items-center justify-between gap-2 mb-1">';
    out += '<div class="flex items-center gap-2 min-w-0">';
    if (num) out += '<span class="text-[10px] font-bold bg-accent/15 text-accent w-5 h-5 rounded-full flex items-center justify-center shrink-0">' + num + '</span>';
    out += '<span class="text-sm font-semibold text-[#47635f] truncate">' + merchant + '</span>';
    out += '</div>';
    out += '<span class="text-sm font-bold text-[#47635f] font-mono shrink-0">' + amount + '원</span>';
    out += '</div>';
    // 날짜
    if (dateText) out += '<div class="text-[10px] text-[#6e7f7b] mb-2 ml-7">' + dateText + '</div>';
    // 세부 정보
    if (details.length > 0) {
      out += '<div class="ml-7 space-y-0.5">';
      details.forEach(function(d) {
        out += '<div class="flex gap-1.5 text-[11px]"><span class="text-[#aab5b2] shrink-0">' + d.label + '</span><span class="text-[#47635f]">' + d.value + '</span></div>';
      });
      out += '</div>';
    }
    // 가맹점 정보
    if (cardInfo.length > 0) {
      out += '<div class="ml-7 mt-1 space-y-0.5">';
      cardInfo.forEach(function(d) {
        out += '<div class="text-[10px] text-[#aab5b2]">' + d.label + ': ' + d.value + '</div>';
      });
      out += '</div>';
    }
    out += '</div>';
  });

  return out;
}

/** 일반 문서 — DOM 정리 + 테이블 카드 변환 */
function _parseGenericDoc(tmp) {
  var keep = {colspan:1, rowspan:1};
  tmp.querySelectorAll('*').forEach(function(el) {
    for (var i = el.attributes.length - 1; i >= 0; i--)
      if (!(el.attributes[i].name in keep)) el.removeAttribute(el.attributes[i].name);
  });
  tmp.querySelectorAll('img').forEach(function(img) { img.remove(); });
  tmp.querySelectorAll('table').forEach(function(tbl) {
    var cards = _tblToCards(tbl);
    if (cards) { var d = document.createElement('div'); d.innerHTML = cards; tbl.parentNode.replaceChild(d, tbl); }
  });
  tmp.querySelectorAll('p').forEach(function(el) {
    if (!el.textContent.replace(/[\s\u00a0]/g, '')) el.remove();
  });
  // ★ 섹션 헤더 스타일링
  tmp.querySelectorAll('p').forEach(function(p) {
    if (/^★/.test(p.textContent.trim())) p.className = 'draft-section-hdr';
  });
  return tmp.innerHTML;
}

/** 테이블 → 모바일 카드 UI 변환 */
function _tblToCards(tbl) {
  var rows = Array.from(tbl.querySelectorAll('tr'));
  if (rows.length < 3) return null;

  // ── 헤더 행 판별 ──
  var hdrN = 0;
  for (var i = 0; i < Math.min(rows.length, 3); i++) {
    if (rows[i].querySelector('th')) { hdrN = i + 1; continue; }
    var cells = rows[i].querySelectorAll('td');
    var isHdr = cells.length > 0;
    for (var c = 0; c < cells.length; c++) {
      var t = cells[c].textContent.trim();
      if (/^\d{1,2}:\d{2}$/.test(t) || /^\d{1,3}$/.test(t)) { isHdr = false; break; }
    }
    if (isHdr && i < 2) hdrN = i + 1; else break;
  }
  if (!hdrN) hdrN = 1;

  // ── 헤더 그리드 (rowspan/colspan 처리) ──
  var maxC = 0;
  rows.slice(0, hdrN).forEach(function(r) {
    var n = 0; r.querySelectorAll('th, td').forEach(function(c) { n += parseInt(c.getAttribute('colspan')) || 1; });
    if (n > maxC) maxC = n;
  });
  var g = [];
  for (var r = 0; r < hdrN; r++) g.push(new Array(maxC).fill(null));

  for (var ri = 0; ri < hdrN; ri++) {
    var cells = rows[ri].querySelectorAll('th, td');
    var ci = 0;
    for (var k = 0; k < cells.length; k++) {
      while (ci < maxC && g[ri][ci] !== null) ci++;
      var cs = parseInt(cells[k].getAttribute('colspan')) || 1;
      var rs = parseInt(cells[k].getAttribute('rowspan')) || 1;
      var txt = cells[k].textContent.replace(/[\s\u00a0]+/g, ' ').trim().replace(/\s*\(.*$/, '');
      for (var dr = 0; dr < rs; dr++)
        for (var dc = 0; dc < cs; dc++)
          if (ri+dr < hdrN && ci+dc < maxC && g[ri+dr][ci+dc] === null) g[ri+dr][ci+dc] = txt;
      ci += cs;
    }
  }

  // 플래튼: 각 컬럼에서 가장 아래 헤더 사용 (서브헤더 우선)
  var hdrs = [];
  for (var c = 0; c < maxC; c++) {
    hdrs[c] = '';
    for (var r = hdrN - 1; r >= 0; r--) { if (g[r][c]) { hdrs[c] = g[r][c]; break; } }
  }

  // ── 데이터 행 → 카드 ──
  var dataRows = rows.slice(hdrN);
  if (!dataRows.length) return null;

  var out = '<div class="space-y-2">';
  dataRows.forEach(function(row, idx) {
    var cells = row.querySelectorAll('td');
    var vals = Array.from(cells).map(function(c) { return c.textContent.replace(/[\s\u00a0]+/g, ' ').trim(); });
    if (!vals.some(function(v) { return v; })) return;

    var isSummary = vals.some(function(v) { return /^(합계|소계|계)$/.test(v); });
    if (isSummary) {
      var parts = [];
      for (var i = 0; i < vals.length && i < hdrs.length; i++)
        if (vals[i] && !/^(합계|소계|계)$/.test(vals[i])) parts.push(hdrs[i] + ' ' + vals[i]);
      out += '<div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-accent/10 border border-accent/20">'
        + '<span class="text-xs font-bold text-accent">합계</span>'
        + (parts.length ? '<span class="text-xs text-accent/80">' + parts.join(' · ') + '</span>' : '')
        + '</div>';
      return;
    }

    var num = vals[0] || String(idx + 1);
    out += '<div class="bg-surface-2 border border-border/60 rounded-xl p-3">'
      + '<div class="flex items-start gap-2">'
      + '<span class="text-[10px] font-bold bg-accent/15 text-accent w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">' + num + '</span>'
      + '<div class="flex flex-wrap gap-x-3 gap-y-1 min-w-0">';
    for (var i = 1; i < vals.length && i < hdrs.length; i++) {
      if (!vals[i]) continue;
      out += '<span class="text-[11px]"><span class="text-[#aab5b2]">' + hdrs[i] + '</span> <span class="text-[#47635f] dark:text-[#b0c4b1] font-medium">' + vals[i] + '</span></span>';
    }
    out += '</div></div></div>';
  });
  out += '</div>';
  return out;
}

function renderDraftDetail(detail) {
  const listWrap = $('draftsCards').parentElement;
  const detailEl = $('draftDetail');

  listWrap.classList.add('hidden');
  detailEl.classList.remove('hidden');

  const title = detail.APPR_SUBJ || '(제목 없음)';
  const docNo = detail.DOC_NO || '';
  const status = detail.APPR_STS_NM || '';
  const dttm = detail.DRAFT_DATE || '';
  let dispDate = '';
  if (dttm.length >= 12) {
    dispDate = dttm.substring(0,4) + '-' + dttm.substring(4,6) + '-' + dttm.substring(6,8)
      + ' ' + dttm.substring(8,10) + ':' + dttm.substring(10,12);
  } else if (dttm.length >= 8) {
    dispDate = dttm.substring(0,4) + '-' + dttm.substring(4,6) + '-' + dttm.substring(6,8);
  }
  const amt = detail.TOT_AMT || '';
  const amtDisp = amt ? Number(String(amt).replace(/,/g, '')).toLocaleString('ko-KR') + '원' : '';

  let detailHtml = '<div class="bg-surface border border-border rounded-2xl overflow-hidden">'
    + '<div class="p-4">'
    + '<button onclick="closeDraftDetail()" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-accent/10 border border-accent/20 text-accent text-xs font-semibold hover:bg-accent/20 transition mb-3">'
    + '<span class="text-sm">←</span> 목록으로</button>'
    + '<div class="text-base font-bold text-[#47635f] mb-2 leading-snug">' + title + '</div>'
    + '<div class="flex flex-wrap items-center gap-1.5 mb-4">'
    + (docNo ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-accent/10 text-accent font-mono font-medium border border-accent/20">' + docNo + '</span>' : '')
    + (status ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-[#e3f2fd] text-[#1565c0] font-semibold border border-[#90caf9] dark:bg-[#1b2a3a] dark:text-[#6fb3f0] dark:border-[#2e4a5e]">' + status + '</span>' : '')
    + (dispDate ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-white/80 dark:bg-white/10 text-[#6e7f7b] border border-border">기안 ' + dispDate + '</span>' : '')
    + (amtDisp ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-white/80 dark:bg-white/10 text-[#47635f] font-mono font-medium border border-border">' + amtDisp + '</span>' : '')
    + '</div>';

  // 결재의견 (본문 위)
  const opinions = detail.opinions || [];
  const isReject = (status || '').includes('반려') || (status || '').includes('반송');

  if (opinions.length) {
    var opColor = isReject
      ? { bg: 'bg-[#ffebee] dark:bg-[#3a1b1b]', border: 'border-[#ef9a9a] dark:border-[#5e2e2e]', text: 'text-[#c62828] dark:text-[#f08080]', sub: 'text-[#c62828]/60 dark:text-[#f08080]/60', badge: 'bg-[#c62828]/10 dark:bg-[#f08080]/10' }
      : { bg: 'bg-[#e3f2fd] dark:bg-[#1b2a3a]', border: 'border-[#90caf9] dark:border-[#2e4a5e]', text: 'text-[#1565c0] dark:text-[#6fb3f0]', sub: 'text-[#1565c0]/60 dark:text-[#6fb3f0]/60', badge: 'bg-[#1565c0]/10 dark:bg-[#6fb3f0]/10' };
    detailHtml += '<div class="mb-3 p-3 rounded-xl ' + opColor.bg + ' border ' + opColor.border + '">'
      + '<div class="text-[10px] font-bold ' + opColor.text + ' uppercase tracking-[1px] mb-2">결재의견</div>';
    opinions.forEach(function(op, i) {
      if (i > 0) detailHtml += '<div class="border-t ' + opColor.border + '/30 my-2"></div>';
      detailHtml += '<div class="flex items-center gap-1.5 mb-1">'
        + (op.name ? '<span class="text-[11px] font-semibold ' + opColor.text + '">' + op.name + '</span>' : '')
        + (op.dept ? '<span class="text-[9px] px-1.5 py-0.5 rounded-full ' + opColor.badge + ' ' + opColor.text + ' font-medium">' + op.dept + (op.pos ? ' ' + op.pos : '') + '</span>' : '')
        + (op.date ? '<span class="text-[9px] ' + opColor.sub + '">' + op.date + '</span>' : '')
        + '</div>'
        + '<div class="text-sm ' + opColor.text + ' leading-relaxed whitespace-pre-wrap">' + op.opinion + '</div>';
    });
    detailHtml += '</div>';
  }

  detailHtml += (detail.APPR_CONT ? '<div class="draft-content border border-border rounded-xl p-3 bg-white dark:bg-[#1a1f2e]">' + parseDraftHtml(detail.APPR_CONT) + '</div>' : '<div class="text-sm text-[#6e7f7b] italic">본문 내용이 없습니다.</div>');

  detailHtml += '</div></div>';
  detailEl.innerHTML = detailHtml;
}

function closeDraftDetail() {
  const listWrap = $('draftsCards').parentElement;
  const detailEl = $('draftDetail');
  detailEl.classList.add('hidden');
  detailEl.innerHTML = '';
  listWrap.classList.remove('hidden');
}

window.fetchDraftList = fetchDraftList;
window.fetchDraftDetail = fetchDraftDetail;
window.closeDraftDetail = closeDraftDetail;

})();
</script>
