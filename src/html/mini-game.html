<style>
@keyframes mgShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
.mg-shake { animation: mgShake .18s ease-in-out; }
@keyframes mgFlash { from{opacity:.5} to{opacity:0} }
.mg-flash { position:absolute;inset:0;background:rgba(255,100,100,.35);pointer-events:none;border-radius:16px;animation:mgFlash .2s ease-out forwards; }
#frSearchResults { max-height:0; overflow:hidden; transition: max-height 0.25s ease; }
#frSearchResults.open { max-height:300px; overflow-y:auto; }
#frSearchResults::-webkit-scrollbar { width:3px; }
#frSearchResults::-webkit-scrollbar-thumb { background:#ccc; border-radius:2px; }
.fr-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; cursor:pointer; transition:background 0.1s; }
.fr-item:hover { background:var(--color-accent-10, rgba(45,212,191,0.08)); }
.fr-item .fr-dot { width:6px; height:6px; border-radius:50%; background:var(--color-accent, #2dd4bf); flex-shrink:0; }
.fr-item .fr-floor { font-size:10px; padding:1px 5px; border-radius:4px; background:var(--color-accent-10, rgba(45,212,191,0.1)); color:var(--color-accent, #2dd4bf); font-weight:600; }
.fr-item .fr-name { font-size:13px; font-weight:500; flex:1; }
.fr-item .fr-cap { font-size:11px; color:#6e7f7b; }
</style>

<!-- ═══════════════ 회의실 찾기 ═══════════════ -->
<section id="sectionFindRoom" class="mb-6">
  <div class="bg-surface border border-border rounded-2xl p-5">
    <div class="flex items-center gap-2.5 mb-3">
      <div class="w-8 h-8 rounded-lg bg-accent/10 flex items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </div>
      <div>
        <div class="text-sm font-semibold">회의실 찾기</div>
        <div class="text-[11px] text-[#6e7f7b]">혁신이 어디 있다는거...</div>
      </div>
    </div>
    <div class="relative">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[#6e7f7b] pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="frSearchInput" type="text" placeholder="회의실명 검색..." autocomplete="off"
        class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-border bg-surface-2 text-[13px] outline-none focus:border-accent transition-colors"
        oninput="frOnSearch()" onkeydown="frOnKey(event)" onfocus="frOnSearch()"/>
    </div>
    <div id="frSearchResults"></div>

    <!-- Flow 공유 패널 (회의실 선택 후 표시) -->
    <div id="frSharePanel" class="hidden mt-3 pt-3 border-t border-border">
      <div class="flex items-center gap-2 mb-2">
        <span class="text-[12px] font-semibold">📍 <span id="frShareRoom"></span></span>
        <button onclick="frCloseShare()" class="ml-auto text-[11px] text-[#6e7f7b] hover:text-[#47635f]">취소</button>
      </div>
      <div class="flex gap-2 mb-2">
        <button onclick="frOpenMap()" class="flex-1 py-2 rounded-lg bg-accent/10 text-accent text-[12px] font-semibold hover:bg-accent/20 transition">지도 보기</button>
        <button onclick="frToggleFlowShare()" id="frFlowBtn" class="flex-1 py-2 rounded-lg bg-accent text-white text-[12px] font-semibold hover:brightness-110 transition">Flow로 공유</button>
      </div>
      <div id="frFlowArea" class="hidden">
        <div class="relative mb-1.5">
          <input id="frUserSearch" type="text" placeholder="이름 또는 ID로 검색 (본인 포함)" autocomplete="off"
            class="w-full bg-surface-2 border border-border rounded-lg px-3 py-2 text-[12px] outline-none focus:border-accent transition placeholder:text-[#6e7f7b]/60"
            oninput="frSearchUsers()"/>
        </div>
        <div id="frUserResults" class="max-h-32 overflow-y-auto"></div>
      </div>
    </div>
  </div>
</section>
<script>
(function(){
  var frRooms = [
    {name:'성장',f:5,cap:'6인'},{name:'도전',f:5,cap:'6인'},{name:'열정',f:5,cap:'6인'},
    {name:'소통',f:5,cap:'30인'},{name:'소접견실',f:5,cap:'4인'},{name:'대접견실',f:5,cap:'8인'},
    {name:'쉼',f:5,cap:''},{name:'배움',f:5,cap:'4인'},{name:'기회',f:5,cap:'6인'},
    {name:'협력',f:5,cap:'6인'},{name:'비전',f:5,cap:'4인'},{name:'프론티어',f:5,cap:'16인'},
    {name:'미래',f:5,cap:'4인'},{name:'창조',f:5,cap:'6인'},{name:'존중',f:5,cap:'6인'},
    {name:'공감',f:5,cap:'6인'},
    {name:'원팀',f:7,cap:'11인'},{name:'인재',f:7,cap:'8인'},{name:'피플',f:7,cap:'6인'},
    {name:'혁신',f:7,cap:'10인'},{name:'탐구',f:7,cap:'12인'}
  ];
  var _selectedRoom = null;
  var _frSearchTimer = null;
  var _frUserCache = null;

  // 사용자 목록 프리로드 (이쏜미와 동일 패턴)
  function _frPreloadUsers(){
    if(_frUserCache) return;
    var token=localStorage.getItem('token');
    if(!token||!window.gasFetch||!window.API_URL) return;
    window.gasFetch(window.API_URL+'?action=getBizFlowUserList&token='+encodeURIComponent(token)).then(function(res){
      if(!res||!res.ok||!res.d) return;
      try{
        var b64=res.d.split('').reverse().join('');
        var bin=atob(b64);
        var bytes=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
        var arr=JSON.parse(new TextDecoder().decode(bytes));
        _frUserCache=arr.map(function(u){return{knoxId:u[0],name:u[1],dept:u[2]};});
      }catch(e){}
    }).catch(function(){});
  }
  // 페이지 로드 시 프리로드
  setTimeout(_frPreloadUsers, 500);

  function frHL(t,q){
    var i=t.toLowerCase().indexOf(q);
    if(i===-1)return t;
    return t.slice(0,i)+'<b style="color:var(--color-accent,#2dd4bf)">'+t.slice(i,i+q.length)+'</b>'+t.slice(i+q.length);
  }

  window.frOnSearch = function(){
    var q=(document.getElementById('frSearchInput').value||'').trim().toLowerCase();
    var el=document.getElementById('frSearchResults');
    var list=frRooms;
    if(q) list=list.filter(function(r){return r.name.toLowerCase().indexOf(q)>=0||(r.cap||'').toLowerCase().indexOf(q)>=0});
    if(!list.length){
      el.innerHTML='<div style="text-align:center;padding:12px;font-size:12px;color:#6e7f7b">검색 결과 없음</div>';
      el.classList.add('open');return;
    }
    el.innerHTML=list.map(function(r){
      return '<div class="fr-item" onclick="frSelect(\''+r.name+'\','+r.f+')">'
        +'<div class="fr-dot"></div>'
        +'<span class="fr-floor">'+r.f+'층</span>'
        +'<div class="fr-name">'+(q?frHL(r.name,q):r.name)+'</div>'
        +'<div class="fr-cap">'+(r.cap||'')+'</div></div>';
    }).join('');
    el.classList.add('open');
  };

  window.frOnKey = function(e){
    if(e.key==='Enter'){
      var first=document.querySelector('#frSearchResults .fr-item');
      if(first)first.click();
    }
  };

  window.frSelect = function(name, floor){
    _selectedRoom = { name: name, floor: floor };
    document.getElementById('frSearchInput').value='';
    document.getElementById('frSearchResults').classList.remove('open');
    document.getElementById('frShareRoom').textContent = floor + '층 ' + name;
    document.getElementById('frSharePanel').classList.remove('hidden');
    document.getElementById('frFlowArea').classList.add('hidden');
    if(window._lifeAnimate) window._lifeAnimate('frSharePanel');
  };

  window.frOpenMap = function(){
    if(!_selectedRoom) return;
    var url='floor-3d.html?room='+encodeURIComponent(_selectedRoom.name);
    var isMobile=window.innerWidth<=768;
    if(isMobile){
      window.open(url,'_blank');
    } else {
      var w=900,h=700;
      var left=(screen.width-w)/2, top=(screen.height-h)/2;
      window.open(url,'findRoom','width='+w+',height='+h+',left='+left+',top='+top+',scrollbars=no,resizable=yes');
    }
  };

  window.frCloseShare = function(){
    _selectedRoom = null;
    document.getElementById('frSharePanel').classList.add('hidden');
    document.getElementById('frFlowArea').classList.add('hidden');
  };

  window.frToggleFlowShare = function(){
    var area = document.getElementById('frFlowArea');
    area.classList.toggle('hidden');
    if(!area.classList.contains('hidden')){
      document.getElementById('frUserSearch').value='';
      document.getElementById('frUserResults').innerHTML='';
      document.getElementById('frUserSearch').focus();
    }
  };

  // 사용자 검색 (로컬 캐시 우선 → API 폴백, 이쏜미와 동일)
  window.frSearchUsers = function(){
    clearTimeout(_frSearchTimer);
    var word = (document.getElementById('frUserSearch').value||'').trim().toLowerCase();
    var el = document.getElementById('frUserResults');
    if(word.length < 1){ el.innerHTML=''; return; }

    if(_frUserCache){
      var results = [];
      for(var i=0; i<_frUserCache.length; i++){
        var u=_frUserCache[i];
        if(u.name.toLowerCase().indexOf(word)!==-1 || u.knoxId.toLowerCase().indexOf(word)!==-1){
          results.push(u);
        }
        if(results.length>=20) break;
      }
      _frRenderUsers(results);
      return;
    }

    // 캐시 없으면 API 폴백
    _frSearchTimer = setTimeout(function(){
      el.innerHTML='<div class="text-[11px] text-[#9ab0ab] py-2 text-center">검색 중...</div>';
      var token=localStorage.getItem('token');
      if(!token||!window.gasFetch||!window.API_URL) return;
      window.gasFetch(window.API_URL+'?action=searchBizFlowUsers&token='+encodeURIComponent(token)+'&searchWord='+encodeURIComponent(word)).then(function(data){
        if(!data||!data.users){el.innerHTML='';return;}
        _frRenderUsers(data.users);
      }).catch(function(){el.innerHTML='';});
    },400);
  };

  function _frRenderUsers(users){
    var el=document.getElementById('frUserResults');
    if(!users.length){el.innerHTML='<div class="text-[11px] text-[#9ab0ab] px-1 py-2">검색 결과가 없어.</div>';return;}
    el.innerHTML=users.map(function(u){
      return '<button onclick=\'frSendFlow('+JSON.stringify(u).replace(/\x27/g,"\\'")+')\''+
        ' class="w-full flex items-center justify-between px-2.5 py-2 rounded-lg hover:bg-accent/10 transition text-left">'+
        '<div><span class="text-[13px] font-medium text-[#47635f]">'+u.name+'</span> <span class="text-[11px] text-[#9ab0ab]">'+(u.dept||'')+'</span></div>'+
        '<span class="text-accent text-[11px] font-semibold">전송</span></button>';
    }).join('');
  }

  window.frSendFlow = async function(user){
    if(!_selectedRoom) return;
    var token=localStorage.getItem('token');
    if(!token||!window.gasFetch||!window.API_URL){
      if(window.showToast) window.showToast('로그인이 필요해','sad');
      return;
    }
    try{
      var data = await window.gasFetch(window.API_URL+'?action=sendFindRoomFlow&token='+encodeURIComponent(token)
        +'&targetKnoxId='+encodeURIComponent(user.knoxId)
        +'&roomName='+encodeURIComponent(_selectedRoom.name)
        +'&floor='+encodeURIComponent(_selectedRoom.floor));
      if(data&&data.status==='success'){
        if(window.showToast) window.showToast(user.name+'에게 전송 완료!','smail');
      } else {
        if(window.showToast) window.showToast(data&&data.error||'전송 실패','sad');
      }
    }catch(e){
      if(window.showToast) window.showToast('전송 실패','sad');
    }
  };

  // 바깥 클릭 시 결과 닫기
  document.addEventListener('click',function(e){
    var sec=document.getElementById('sectionFindRoom');
    if(sec&&!sec.contains(e.target)){
      document.getElementById('frSearchResults').classList.remove('open');
    }
  });
})();
</script>

<!-- ═══════════════ 미니게임 ═══════════════ -->
<section id="sectionMiniGame" class="mb-6">
  <div class="bg-surface border border-border rounded-2xl p-5">
    <div class="flex items-center gap-2.5 mb-3">
      <div class="w-8 h-8 rounded-lg bg-accent/10 flex items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.58-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/></svg>
      </div>
      <div>
        <div class="text-sm font-semibold">미니게임</div>
        <div class="text-[11px] text-[#6e7f7b]">퇴근 러너 - 장애물을 피해 무사히 퇴근하자!</div>
      </div>
    </div>

    <!-- 게임 홈 -->
    <div id="mgHome">
      <div class="text-center py-6">
        <div class="text-3xl mb-3">🏃</div>
        <button onclick="mgStartGame()" class="px-6 py-2.5 rounded-xl bg-accent text-white font-semibold text-sm hover:brightness-110 transition">
          시작
        </button>
        <div class="text-[11px] text-[#6e7f7b] mt-3">↑/탭 점프 · ↓/스와이프 슬라이드 · Space 폭탄</div>
        <div class="text-[11px] text-[#6e7f7b]">모바일: 두 손가락 탭 폭탄 · 장애물을 피해 퇴근하자!</div>
      </div>
      <div id="mgRankArea" class="mt-2">
        <div class="text-[11px] text-[#6e7f7b] mb-1.5 font-semibold">🏆 랭킹</div>
        <div id="mgRankList" class="space-y-1"></div>
      </div>
    </div>

    <!-- 게임 결과 (Top5 진입 시) -->
    <div id="mgResult" class="hidden">
      <div class="text-center py-5">
        <div class="text-lg font-bold text-accent mb-1" id="mgResultTitle">🏆 랭킹 진입!</div>
        <div class="text-[13px] text-[#47635f] font-semibold mb-3" id="mgResultScore"></div>
        <div class="mb-3">
          <input id="mgResultMsg" type="text" maxlength="20" placeholder="한마디 남기기 (최대 20자)"
            class="w-full px-3 py-2 rounded-lg border border-border bg-surface text-sm text-center focus:outline-none focus:border-accent">
        </div>
        <div class="flex gap-2 justify-center">
          <button onclick="mgSubmitRank()" class="px-5 py-2 rounded-xl bg-accent text-white font-semibold text-sm hover:brightness-110 transition">등록</button>
          <button onclick="mgSkipRank()" class="px-5 py-2 rounded-xl bg-surface-2 text-[#6e7f7b] font-semibold text-sm hover:brightness-110 transition">건너뛰기</button>
        </div>
      </div>
    </div>

    <!-- 게임 플레이 -->
    <div id="mgPlay" class="hidden">
      <div class="flex items-center justify-between mb-2 px-1">
        <span id="mgScoreLabel" class="text-[11px] text-[#6e7f7b] font-mono">0m</span>
        <div class="flex items-center gap-2">
          <span id="mgWaveLabel" class="text-[10px] text-accent font-semibold">회사 앞</span>
          <div id="mgBombTray" class="flex gap-1"></div>
        </div>
      </div>
      <div class="mb-2 px-1">
        <div class="flex items-center gap-1.5">
          <span class="text-[10px] text-[#6e7f7b]">HP</span>
          <div class="flex-1 h-2 bg-surface-2 rounded-full overflow-hidden">
            <div id="mgHpBar" class="h-full bg-accent rounded-full transition-all duration-300" style="width:100%"></div>
          </div>
          <span id="mgHpText" class="text-[10px] text-[#6e7f7b] font-mono w-8 text-right">3/3</span>
        </div>
        <div id="mgPowerTimer" class="hidden mt-1">
          <div class="flex items-center gap-1.5">
            <span class="text-[10px] text-accent">☕</span>
            <div class="flex-1 h-1.5 bg-surface-2 rounded-full overflow-hidden">
              <div id="mgPowerBar" class="h-full bg-[#8B6914] rounded-full transition-all duration-100"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="mgStage" class="relative rounded-2xl overflow-hidden" style="touch-action:none"></div>
      <div class="flex items-center justify-between mt-2 px-1">
        <span class="text-[10px] text-[#6e7f7b]">↑점프 ↓슬라이드 Space폭탄</span>
        <button onclick="mgStopGame()" class="text-[10px] text-[#6e7f7b] hover:text-accent transition underline">그만하기</button>
      </div>
    </div>
  </div>
</section>

<script>
(function() {
  var $ = function(id) { return document.getElementById(id); };

  var GAME_WIDTH = 420, GAME_HEIGHT = 320;
  var GAME_NAME = '퇴근러너', MAX_HP = 3;
  var GRAVITY = 1600, JUMP_VEL = -540;
  var BASE_SPEED = 170, MAX_SPEED = 380;
  var SLIDE_MS = 420;
  var _rankCache = [];

  /* ═══════════════ 랭킹 (구글시트 연동) ═══════════════ */
  function fetchRanking(cb) {
    var token = localStorage.getItem('token');
    if (!token || !window.gasFetch || !window.API_URL) { if (cb) cb([]); return; }
    var box = $('mgRankList');
    if (box) box.innerHTML = '<div class="flex justify-center py-3"><svg class="animate-spin w-5 h-5 text-accent" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>';
    window.gasFetch(window.API_URL + '?action=gameRankList&token=' + encodeURIComponent(token) + '&game=' + encodeURIComponent(GAME_NAME))
      .then(function(data) {
        _rankCache = (data && data.ranks) ? data.ranks : [];
        renderRanking();
        if (cb) cb(_rankCache);
      }).catch(function() { renderRanking(); if (cb) cb(_rankCache); });
  }

  function saveRanking(score, message) {
    var token = localStorage.getItem('token');
    if (!token || !window.gasFetch || !window.API_URL) return;
    window.gasFetch(window.API_URL + '?action=gameRankSave&token=' + encodeURIComponent(token) +
      '&game=' + encodeURIComponent(GAME_NAME) +
      '&score=' + score +
      '&message=' + encodeURIComponent(message || ''))
      .then(function() { fetchRanking(); })
      .catch(function() {});
  }

  function renderRanking() {
    var box = $('mgRankList'); if (!box) return;
    var list = _rankCache;
    if (!list.length) { box.innerHTML = '<div class="text-[11px] text-[#9ab0ab] text-center py-2">아직 기록이 없어</div>'; return; }
    var medals = ['🥇','🥈','🥉','4위','5위'];
    box.innerHTML = list.map(function(r,i) {
      return '<div class="flex items-center justify-between bg-surface-2 rounded-lg px-3 py-1.5">' +
        '<span class="text-[12px]">' + medals[i] + ' <span class="font-semibold text-[#47635f]">' + r.score + '점</span></span>' +
        '<span class="text-[11px] text-[#6e7f7b]">' + _esc(r.message || '') + '</span></div>';
    }).join('');
  }

  function _esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  var _cleanup = null;
  var _pendingScore = 0; /* 등록 대기 점수 */

  window.mgStartGame = function() {
    $('mgHome').classList.add('hidden'); $('mgResult').classList.add('hidden');
    $('mgPlay').classList.remove('hidden');
    if (window._lifeAnimate) window._lifeAnimate('mgPlay');
    startGame();
  };
  window.mgStopGame = function() {
    if (_cleanup) { _cleanup(); _cleanup = null; }
    $('mgPlay').classList.add('hidden'); $('mgResult').classList.add('hidden');
    $('mgHome').classList.remove('hidden');
    fetchRanking();
  };

  /* Top5 진입 → 결과 화면에서 메시지 입력 후 등록 */
  window.mgSubmitRank = function() {
    var msg = ($('mgResultMsg').value || '').trim().substring(0, 20);
    if (!msg) msg = _pendingScore + '점';
    saveRanking(_pendingScore, msg);
    $('mgResult').classList.add('hidden');
    $('mgHome').classList.remove('hidden');
    if (window.showToast) window.showToast('랭킹에 등록됐어!', 'smail');
  };
  window.mgSkipRank = function() {
    $('mgResult').classList.add('hidden');
    $('mgHome').classList.remove('hidden');
    fetchRanking();
  };

          var g4 = c.createRadialGradient(cx - 1, cy - 1, 1, cx, cy, r);
          g4.addColorStop(0, '#ffee88'); g4.addColorStop(1, '#cc8800');
          c.fillStyle = g4; c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#fff'; c.beginPath();
          for (var i3 = 0; i3 < 5; i3++) {
            var a = Math.PI * 2 * i3 / 5 - Math.PI / 2, ir = r * 0.35, or = r * 0.7;
            c.lineTo(cx + Math.cos(a) * or, cy + Math.sin(a) * or);
            var a2 = a + Math.PI / 5;
            c.lineTo(cx + Math.cos(a2) * ir, cy + Math.sin(a2) * ir);
          }
          c.closePath(); c.fill();
        }
      });
    }

        particles.push({
          x: x, y: y, r: 1.5 + Math.random() * 2,
          vx: Math.cos(angle) * (30 + Math.random() * 50),

          r: 1 + Math.random() * 1.5,
          vx: -(scrollSpeed * 0.3 + Math.random() * 20),

    function drawParticles(delta) {
      var remain = [];
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i]; p.life -= delta;
        if (p.life <= 0) continue;
        p.x += p.vx * delta; p.y += p.vy * delta;
        p.vy += 200 * delta;
        var a = p.life / p.max;
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2); ctx.fill();
        remain.push(p);
      }
      ctx.globalAlpha = 1;
      particles = remain;
    }

        ctx.globalAlpha = Math.min(1, ft.life / ft.max * 2);
        ctx.fillStyle = '#000'; ctx.fillText(ft.text, ft.x + 0.5, ft.y + 0.5);
        ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);

    /* ═══════════════ 입력 ═══════════════ */
    function doJump() {
      if (player.state !== 'jump') {

      }
    }

    var touchStartY = null, swiped = false;
    function onTouchStart(e) {
      if (!running) return; /* 게임오버 시 결과 화면으로 전환됨 */
      e.preventDefault();
      /* 두 손가락 탭 = 폭탄 */
      if (e.touches.length >= 2) { triggerBomb(performance.now()); return; }
      touchStartY = e.touches[0].clientY;
      swiped = false;
    }
    function onTouchMove(e) {
      e.preventDefault();
      if (touchStartY === null) return;
      var dy = e.touches[0].clientY - touchStartY;
      if (dy > 22 && !swiped) {
        swiped = true;
        if (player.state !== 'jump') touchSlideUntil = performance.now() + SLIDE_MS;
      }
    }
    function onTouchEnd(e) {
      if (!swiped && touchStartY !== null) doJump();
      touchStartY = null; swiped = false;
    }

    function onKeyDown(e) {
      var code = e.code || e.key;
      if (!running) return; /* 게임오버 시 결과 화면으로 전환됨 */
      if (['ArrowUp', 'ArrowDown', 'Space', 'KeyW', 'KeyS'].indexOf(code) !== -1) e.preventDefault();
      keys[code] = true;
      if (code === 'ArrowUp' || code === 'KeyW') doJump();
      if (code === 'Space') triggerBomb(performance.now());
    }
    function onKeyUp(e) { delete keys[e.code || e.key]; }

    /* ═══════════════ 리셋 ═══════════════ */
    function resetGame() {
      distance = 0; score = 0; baseHp = MAX_HP; scrollSpeed = BASE_SPEED;
      invulnUntil = 0; coffeeUntil = 0;
      bombs = 1; shield = 0; slowUntil = 0;
      combo = 0; comboUntil = 0; wave = 1; nextWaveDist = 200;
      waveAnnounce = 0;
      nextSpawnDist = 180; nextItemDist = 300;
      nextMilestoneIdx = 0; milestoneAnnounce = 0;
      player.y = GROUND_Y - PH; player.vy = 0; player.state = 'run';
      touchSlideUntil = 0;
      obstacles = []; items = []; particles = []; floatTexts = [];
      running = true; lastTime = performance.now(); gameOverHandled = false;
      updateUI();
    }

    /* ═══════════════ 게임 루프 ═══════════════ */
    function tick(time) {
      if (!running) { drawGameOver(); handleGameOver(); return; }
      if (!document.body.contains(canvas)) { doCleanup(); return; }

      var delta = Math.min(0.05, (time - lastTime) / 1000);
      frameTime = time; lastTime = time;

      /* 속도 증가 + 슬로우 */
      scrollSpeed = Math.min(MAX_SPEED, BASE_SPEED + distance * 0.1 + wave * 8);
      var slowFactor = time < slowUntil ? 0.45 : 1;
      var scrollDelta = scrollSpeed * slowFactor * delta;
      distance += scrollDelta * 0.3;
      /* 거리 기반 점수 (콤보 보너스) */
      var comboMul = combo >= 10 ? 3 : combo >= 6 ? 2 : combo >= 3 ? 1.5 : 1;
      score += scrollDelta * 0.2 * comboMul;

      /* 슬라이드 판정 */
      var isSliding = keys['ArrowDown'] || keys['KeyS'] || (time < touchSlideUntil);
      if (isSliding && player.state !== 'jump') {
        player.state = 'slide';
      } else if (player.state === 'slide' && !isSliding) {
        player.state = 'run';
      }

      /* 점프 물리 */
      if (player.state === 'jump') {
        player.vy += GRAVITY * delta;
        player.y += player.vy * delta;
        if (player.y >= GROUND_Y - PH) {
          player.y = GROUND_Y - PH;
          player.vy = 0;
          player.state = isSliding ? 'slide' : 'run';
        }
      }

      /* 장애물 이동 & 스폰 */
      nextSpawnDist -= scrollDelta;
      if (nextSpawnDist <= 0) {
        spawnObstacle();
        var minGap = Math.max(100, 240 - distance * 0.04);
        nextSpawnDist = minGap + Math.random() * 160;
      }

      obstacles = obstacles.filter(function(ob) {
        ob.x -= scrollDelta; return ob.x + ob.w > -10;
      });

      /* 아이템 이동 & 스폰 */
      nextItemDist -= scrollDelta;
      if (nextItemDist <= 0) {
        spawnItem();
        nextItemDist = 350 + Math.random() * 250;
      }
      items = items.filter(function(it) {
        it.x -= scrollDelta; return it.x + it.w > -10;
      });

      /* 충돌 */
      var pb = getPlayerBox();
      for (var oi = obstacles.length - 1; oi >= 0; oi--) {
        var ob = obstacles[oi];
        if (rectHit(pb.x + 2, pb.y + 2, pb.w - 4, pb.h - 4, ob.x, ob.y, ob.w, ob.h)) {
          var msgs = hitMessages[ob.type] || ['앗!'];
          spawnFloatText(ob.x + ob.w / 2, ob.y - 5, msgs[Math.floor(Math.random() * msgs.length)], '#ff8866');
          spawnHitParticles(ob.x + ob.w / 2, ob.y + ob.h / 2, '#ff6644');
          obstacles.splice(oi, 1);
          loseLife(time);
          if (!running) break;
        }
      }

      /* 장애물 회피 = 콤보 (플레이어 x를 지나가면 회피 성공) */
      for (var ci = obstacles.length - 1; ci >= 0; ci--) {
        var cob = obstacles[ci];
        if (!cob.passed && cob.x + cob.w < player.x) {
          cob.passed = true;
          combo++; comboUntil = time + 1800;
          var pts = 10 + Math.min(20, combo * 2);
          score += pts;
          if (combo >= 3) spawnFloatText(player.x + PW / 2, player.y - 8, '+' + pts, combo >= 10 ? '#ff6644' : combo >= 6 ? '#ffaa44' : '#88ffdd');
        }
      }
      if (combo && time > comboUntil) combo = 0;

      /* 아이템 수집 */
      for (var ii = items.length - 1; ii >= 0; ii--) {
        var it = items[ii];
        if (rectHit(pb.x, pb.y, pb.w, pb.h, it.x, it.y, it.w, it.h)) {
          var cm = collectMsgs[it.type] || ['!'];
          var cmsg = cm[Math.floor(Math.random() * cm.length)];
          if (it.type === 'coffee') {
            coffeeUntil = time + 3000;
            spawnFloatText(it.x, it.y - 5, cmsg, '#daa520');
          } else if (it.type === 'snack') {
            baseHp = Math.min(MAX_HP, baseHp + 1);
            spawnFloatText(it.x, it.y - 5, cmsg, '#66cc44');
          } else if (it.type === 'bomb') {
            bombs = Math.min(3, bombs + 1);
            spawnFloatText(it.x, it.y - 5, cmsg, '#ff6644');
          } else if (it.type === 'shield') {
            shield = 1;
            spawnFloatText(it.x, it.y - 5, cmsg, '#44ddbb');
          } else if (it.type === 'slow') {
            slowUntil = time + 3500;
            spawnFloatText(it.x, it.y - 5, cmsg, '#66aaff');
          } else if (it.type === 'bonus') {
            score += 50;
            spawnFloatText(it.x, it.y - 5, cmsg, '#ffdd44');
          }
          var itemColors = { coffee: '#daa520', snack: '#88cc66', bomb: '#ff6644', shield: '#44ddbb', slow: '#66aaff', bonus: '#ffdd44' };
          spawnHitParticles(it.x + it.w / 2, it.y + it.h / 2, itemColors[it.type] || '#88cc66');
          items.splice(ii, 1);
        }
      }

      /* 웨이브 시스템 */
      if (distance >= nextWaveDist) {
        wave++;
        nextWaveDist += 140 + wave * 40;
        waveAnnounce = time + 2000;
        spawnItem(); /* 웨이브 보상 아이템 */
      }

      /* 마일스톤 */
      checkMilestone(time);
      /* 먼지 */
      spawnDust();

      /* ═══════════════ 렌더 ═══════════════ */
      ctx.clearRect(0, 0, cw, ch);
      drawBackground(delta);
      drawSlowOverlay(time);
      drawSpeedLines();
      drawObstacles();
      drawItems(time);
      drawPlayer(time);
      drawParticles(delta);
      drawFloatTexts(delta);
      drawCombo();
      drawWaveAnnounce(time);
      drawMilestone(time);

      updateUI(); updateCoffeeTimer(time);
      requestAnimationFrame(tick);
    }

    /* ═══════════════ 이벤트 & 정리 ═══════════════ */
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd);

    function doCleanup() {
      running = false;
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      canvas.removeEventListener('touchstart', onTouchStart);
      canvas.removeEventListener('touchmove', onTouchMove);
      canvas.removeEventListener('touchend', onTouchEnd);
    }
    _cleanup = doCleanup;
    resetGame(); requestAnimationFrame(tick);
  }

  fetchRanking();
})();
</script>
