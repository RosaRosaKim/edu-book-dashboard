    </div>
    <div id="menuAlarmToggle" class="flex rounded-xl bg-surface-2 p-1 gap-0.5 relative overflow-hidden">
      <button onclick="setMenuAlarmValue(true)" id="menuAlarmBtnOn"
        class="flex-1 relative z-10 rounded-lg px-3 py-2 transition-colors duration-200 flex items-center justify-center gap-1.5 text-[12px] font-semibold text-[#6e7f7b]">
        <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/></svg>
        좋아

      <button onclick="setMenuAlarmValue(false)" id="menuAlarmBtnOff"

        싫어
      </button>

  </div>

<script>
(function() {
  var $ = function(id) { return document.getElementById(id); };
  var _menuAlarmLoading = false;
  var _menuAlarmBtnOnIcon = '';
  var _menuAlarmBtnOffIcon = '';

  function _moveSlider(container, sliderId, activeBtn) {
    if (!container || !activeBtn) return;
    if (activeBtn.offsetWidth === 0) {
      requestAnimationFrame(function() { _moveSlider(container, sliderId, activeBtn); });
      return;
    }
    var slider = document.getElementById(sliderId);
    if (!slider) {
      slider = document.createElement('div');
      slider.id = sliderId;
      slider.className = 'absolute rounded-lg bg-accent shadow-sm';
      slider.style.cssText = 'top:4px;bottom:4px;pointer-events:none;z-index:0;transition:left .25s cubic-bezier(.4,0,.2,1),width .25s cubic-bezier(.4,0,.2,1)';
      container.insertBefore(slider, container.firstChild);
    }
    slider.style.left = activeBtn.offsetLeft + 'px';
    slider.style.width = activeBtn.offsetWidth + 'px';
  }

  function setMenuAlarmBtnState(on) {
    var btnOn = $('menuAlarmBtnOn');
    var btnOff = $('menuAlarmBtnOff');
    if (!btnOn || !btnOff) return;
    var el = $('menuAlarmToggle');
    el.dataset.on = on ? '1' : '0';

    if (!_menuAlarmBtnOnIcon) _menuAlarmBtnOnIcon = btnOn.querySelector('svg')?.outerHTML || '';
    if (!_menuAlarmBtnOffIcon) _menuAlarmBtnOffIcon = btnOff.querySelector('svg')?.outerHTML || '';

    var activeClass = 'text-white';
    var inactiveClass = 'text-[#6e7f7b]';
    var disabledClass = ' opacity-35 cursor-not-allowed';
    var spinnerSvg = '<svg class="animate-spin h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>';

    var base = 'flex-1 relative z-10 rounded-lg px-3 py-2 transition-colors duration-200 flex items-center justify-center gap-1.5 text-[12px] font-semibold ';
    btnOn.className = base + (on ? activeClass : inactiveClass) + (_menuAlarmLoading ? disabledClass : '');
    btnOff.className = base + (!on ? activeClass : inactiveClass) + (_menuAlarmLoading ? disabledClass : '');

    var onIconEl = btnOn.querySelector('svg');
    var offIconEl = btnOff.querySelector('svg');
    if (_menuAlarmLoading) {
      if (on && onIconEl) onIconEl.outerHTML = spinnerSvg;
      if (!on && offIconEl) offIconEl.outerHTML = spinnerSvg;
      btnOn.disabled = true;
      btnOff.disabled = true;
    } else {
      if (onIconEl) onIconEl.outerHTML = _menuAlarmBtnOnIcon;
      if (offIconEl) offIconEl.outerHTML = _menuAlarmBtnOffIcon;
      btnOn.disabled = false;
      btnOff.disabled = false;
    }

    requestAnimationFrame(function() {
      _moveSlider(el, 'menuAlarmSlider', on ? btnOn : btnOff);
    });
  }

  window.setMenuAlarmValue = async function(newVal) {
    var el = $('menuAlarmToggle');
    var isOn = el.dataset.on === '1';
    if (_menuAlarmLoading || newVal === isOn) return;

    _menuAlarmLoading = true;
    setMenuAlarmBtnState(newVal);
    var token = localStorage.getItem('token');

    try {
      var data = await window.gasFetch(window.API_URL + '?action=updateMenuAlarm&token=' + encodeURIComponent(token) + '&isAgreed=' + newVal);
      if (data.status === 'success') {
        window._menuAlarmOn = newVal;
        window.showToast(newVal ? '식단 알람 보내줄게!' : '식단 알람 안 보낼게.', 'smail');
      } else {
        setMenuAlarmBtnState(isOn);
        window.showToast('알람 설정 변경에 실패했어.', 'sad');
      }
    } catch (e) {
      setMenuAlarmBtnState(isOn);
      window.showToast('서버 연결에 실패했어.', 'sad');
    } finally {
      _menuAlarmLoading = false;
      setMenuAlarmBtnState(el.dataset.on === '1');
    }
  };

  window.initLife = function() {
    var on = !!(window._menuAlarmOn);
    setMenuAlarmBtnState(on);
    // 딥링크 체크
    var pendingSid = sessionStorage.getItem('itsOnMe');
    if (pendingSid) {
      sessionStorage.removeItem('itsOnMe');
      window.openItsOnMeOrder(pendingSid);
    }
    var pendingVote = sessionStorage.getItem('vote');
    if (pendingVote) {
      sessionStorage.removeItem('vote');
      window.openVoteView(pendingVote);
    }
  };
})();
</script>

<script>
(function() {
  var $ = function(id) { return document.getElementById(id); };
  var _store = '';
  var _members = []; // [{knoxId, name, dept}]
  var _searchTimer = null;
  var _menuData = null;
  var _optionsData = null;
  var _selectedMenu = null;
  var _selectedOptions = {};
  var _currentSessionId = null;
  var _currentCat = ''; // 현재 필터 카테고리 ('' = 전체, '★' = 즐겨찾기)
  var _favorites = {}; // { menuId: true }
  var _menuSearchWord = ''; // 메뉴 검색어
  var _lastOrder = null; // { menu, options, price }
  var _orderSession = null; // 현재 주문 세션 정보
  var _orderResponses = []; // 현재 주문 응답 목록
  var _customMenus = []; // 수동입력 메뉴 [{name, price}]
  var _templates = []; // 저장된 템플릿
  var _tplFavorites = {}; // 템플릿 즐겨찾기 { "store_name": true }
  var _userCache = null; // 사용자 목록 로컬 캐시
  var _myDept = ''; // 내 부서
  var _prevSessions = []; // 이전 세션 목록 [{sid, store, created, members:[knoxId]}]

  /* ─── 사용자 목록 프리로드 (인코딩 전송 → 디코드) ─── */
  function _preloadUsers() {
    if (_userCache) { _onUsersReady(); return; }
    var token = localStorage.getItem('token');
    if (!token) { _onUsersReady(); return; }
    window.gasFetch(window.API_URL + '?action=getBizFlowUserList&token=' + encodeURIComponent(token)).then(function(res) {
      if (!res || !res.ok || !res.d) { _onUsersReady(); return; }
      try {
        var b64 = res.d.split('').reverse().join('');
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var arr = JSON.parse(new TextDecoder().decode(bytes));
        _userCache = arr.map(function(u) { return { knoxId: u[0], name: u[1], dept: u[2] }; });
        var myKnox = (res.m || '').toLowerCase();
        for (var j = 0; j < _userCache.length; j++) {
          if (_userCache[j].knoxId.toLowerCase() === myKnox) { _myDept = _userCache[j].dept; break; }
        }
        // 이전 세션 목록: knoxId → 유저 정보 매핑
        _prevSessions = [];
        if (res.p && res.p.length) {
          var cacheMap = {};
          _userCache.forEach(function(u) { cacheMap[u.knoxId.toLowerCase()] = u; });
          res.p.forEach(function(s) {
            var resolved = [];
            (s.members || []).forEach(function(k) {
              var u = cacheMap[k.toLowerCase()];
              if (u) resolved.push(u);
            });
            if (resolved.length) _prevSessions.push({ store: s.store, created: s.created, members: resolved });
          });
        }
      } catch (_) {}
      _onUsersReady();
    }).catch(function() { _onUsersReady(); });
  }

  function _onUsersReady() {
    $('iomLoading').classList.add('hidden');
    $('iomSetup').classList.remove('hidden');
    _showPrevBtn();
    _showDeptMembers();
  }

  /* ─── 이전 발송내역 ─── */
  function _showPrevBtn() {
    $('iomPrevBtn').classList.toggle('hidden', !_prevSessions.length);
    $('iomPrevPanel').classList.add('hidden');
  }

  window.iomTogglePrevPanel = function() {

    $('iomPrevList').innerHTML = _prevSessions.map(function(s, i) {

        '<div class="flex items-center justify-between">' +
          '<span class="text-[12px] font-medium text-[#47635f]">' + s.store + '</span>' +

  };

  window.iomSelectPrevSession = function(idx) {
    var s = _prevSessions[idx];
    if (!s) return;
    _members = s.members.map(function(u) { return { knoxId: u.knoxId, name: u.name, dept: u.dept }; });

  /* ─── 부서원 기본 표시 ─── */
  function _showDeptMembers() {
    if (!_userCache || !_myDept || $('iomUserSearch').value.trim()) return;
    var selectedIds = {};
    _members.forEach(function(m) { selectedIds[m.knoxId.toLowerCase()] = true; });
    var deptUsers = _userCache.filter(function(u) {
      return u.dept === _myDept && !selectedIds[u.knoxId.toLowerCase()];
    });
    if (deptUsers.length) _renderSearchResults(deptUsers);
  }

  /* ─── 가게 선택 ─── */
  window.iomSelectStore = function(store) {
    _store = store;
    _members = [];
    $('iomStoreName').textContent = store;
    $('iomLoadingStore').textContent = store;
    $('iomSelectedMembers').innerHTML = '';
    $('iomUserSearch').value = '';
    $('iomSearchResults').innerHTML = '';

    // 캐시 있으면 바로 설정 화면, 없으면 로딩 표시 후 프리로드

  window.iomBack = function(target) {
    $('iomHome').classList.toggle('hidden', target !== 'home');
    $('iomLoading').classList.add('hidden');
    $('iomSetup').classList.add('hidden');
    $('iomOrder').classList.add('hidden');
    $('iomCustom').classList.add('hidden');
    if (target === 'home') {
      _store = ''; _members = []; _selectedMenu = null; _currentSessionId = null; _customMenus = [];
    }
  };

  /* ─── 수동입력 ─── */
  window.iomOpenCustom = async function() {
    _customMenus = [];
    $('iomHome').classList.add('hidden');
    $('iomCustom').classList.remove('hidden');
    $('iomCustomStore').value = '';
    $('iomCustomMenuName').value = '';
    $('iomCustomMenuPrice').value = '';
    $('iomCustomMenuList').innerHTML = '';
    // 템플릿 로드
    $('iomTplList').innerHTML = '<div class="text-[11px] text-[#9ab0ab] py-1">불러오는 중...</div>';
    try {
      var token = localStorage.getItem('token');
      var res = await window.gasFetch(window.API_URL + '?action=getItsOnMeTemplates&token=' + encodeURIComponent(token));
      _templates = (res && res.templates) || [];
    } catch (_) { _templates = []; }
    _renderTemplates();
  };

  function _renderTemplates() {
    if (!_templates.length) {
      $('iomTplArea').classList.add('hidden');
      return;
    }
    $('iomTplArea').classList.remove('hidden');
    // 즐겨찾기 로드
    try { _tplFavorites = JSON.parse(localStorage.getItem('iomTplFav') || '{}'); } catch(_) { _tplFavorites = {}; }
    // 정렬: 즐겨찾기 → 내 것 → 나머지
    var sorted = _templates.map(function(t, i) { return { t: t, i: i }; });
    sorted.sort(function(a, b) {
      var af = _tplFavorites[a.t.store] ? 0 : 1, bf = _tplFavorites[b.t.store] ? 0 : 1;
      if (af !== bf) return af - bf;
      var am = a.t.isMine ? 0 : 1, bm = b.t.isMine ? 0 : 1;
      return am - bm;
    });
    $('iomTplList').innerHTML = sorted.map(function(s) {
      var t = s.t, i = s.i;
      var menus = [];
      try { menus = JSON.parse(t.menus); } catch(_) {}
      var preview = menus.map(function(m) { return m.name; }).slice(0, 3).join(', ');
      if (menus.length > 3) preview += ' 외 ' + (menus.length - 3) + '개';
      var isFav = !!_tplFavorites[t.store];
      var favBtn = '<button onclick="iomToggleTplFav(' + i + ',event)" class="shrink-0 w-7 h-7 rounded-full transition flex items-center justify-center ' +
        (isFav ? 'text-yellow-500 bg-yellow-50' : 'text-[#c5d5d2] hover:text-yellow-400 hover:bg-yellow-50/50') + '">' +
        '<svg class="w-4 h-4" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="' + (isFav ? 'currentColor' : 'none') + '">' +
        '<path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"/></svg></button>';
      var delBtn = t.isMine ? '<button onclick="iomDeleteTemplate(' + i + ')" class="shrink-0 w-7 h-7 rounded-full text-[#c5d5d2] hover:text-red-400 hover:bg-red-50 transition flex items-center justify-center">' +
          '<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>' +
        '</button>' : '';
      var ownerTag = !t.isMine ? '<span class="text-[9px] text-[#9ab0ab] ml-1">by ' + (t.ownerName || '다른사람') + '</span>' : '';
      return '<div class="flex items-center gap-1">' + favBtn +
        '<button onclick="iomLoadTemplate(' + i + ')" class="flex-1 text-left px-3 py-2 rounded-lg bg-surface-2 hover:bg-accent/10 transition border border-transparent hover:border-accent/20 min-w-0">' +
          '<div class="text-[12px] font-medium text-[#47635f] truncate">' + t.store + ownerTag + '</div>' +
          '<div class="text-[10px] text-[#9ab0ab] truncate">' + preview + '</div>' +
        '</button>' + delBtn + '</div>';
    }).join('');
  }

    else _tplFavorites[t.store] = true;
    localStorage.setItem('iomTplFav', JSON.stringify(_tplFavorites));

  window.iomLoadTemplate = function(idx) {

    $('iomCustomStore').value = t.store;

    var t = _templates[idx];
    if (!t || !confirm(t.store + ' 템플릿을 삭제할까?')) return;
    try {
      var token = localStorage.getItem('token');
      await window.gasFetch(window.API_URL + '?action=deleteItsOnMeTemplate&token=' + encodeURIComponent(token) + '&store=' + encodeURIComponent(t.store));

  window.iomAddCustomMenu = function() {
    var name = ($('iomCustomMenuName').value || '').trim();
    var price = parseInt($('iomCustomMenuPrice').value) || 0;
    if (!name) { window.showToast('메뉴명을 입력해줘', 'sad'); return; }
    _customMenus.push({ name: name, price: price });
    $('iomCustomMenuName').value = '';
    $('iomCustomMenuPrice').value = '';
    $('iomCustomMenuName').focus();

      return '<div class="flex items-center justify-between px-3 py-2 rounded-lg bg-surface-2">' +

  window.iomRemoveCustomMenu = function(idx) {
    _customMenus.splice(idx, 1);
    _renderCustomMenus();
  };

  window.iomSaveTemplate = async function() {
    var store = ($('iomCustomStore').value || '').trim();
    if (!store) { window.showToast('상호명을 입력해줘', 'sad'); return; }
    if (!_customMenus.length) { window.showToast('메뉴를 추가해줘', 'sad'); return; }
    try {
      var token = localStorage.getItem('token');
      await window.gasFetch(window.API_URL + '?action=saveItsOnMeTemplate&token=' + encodeURIComponent(token) +
        '&store=' + encodeURIComponent(store) + '&menus=' + encodeURIComponent(JSON.stringify(_customMenus)));
      window.showToast('저장했어!', 'smail');
      // 템플릿 목록 갱신
      var existing = _templates.find(function(t) { return t.store === store; });
      if (existing) { existing.menus = JSON.stringify(_customMenus); }
      else { _templates.push({ store: store, menus: JSON.stringify(_customMenus), updated: '' }); }
      _renderTemplates();
    } catch (_) { window.showToast('저장 실패', 'sad'); }
  };

  window.iomCustomNext = async function() {
    var store = ($('iomCustomStore').value || '').trim();
    if (!store) { window.showToast('상호명을 입력해줘', 'sad'); return; }
    if (!_customMenus.length) { window.showToast('메뉴를 추가해줘', 'sad'); return; }
    // 자동 저장
    try {
      var token = localStorage.getItem('token');
      await window.gasFetch(window.API_URL + '?action=saveItsOnMeTemplate&token=' + encodeURIComponent(token) +
        '&store=' + encodeURIComponent(store) + '&menus=' + encodeURIComponent(JSON.stringify(_customMenus)));
    } catch (_) {}
    _store = store;
    _members = [];
    $('iomStoreName').textContent = store;
    $('iomLoadingStore').textContent = store;
    $('iomSelectedMembers').innerHTML = '';
    $('iomUserSearch').value = '';
    $('iomSearchResults').innerHTML = '';
    $('iomCustom').classList.add('hidden');
    if (_userCache) {
      $('iomSetup').classList.remove('hidden');
      _showDeptMembers();
    } else {
      $('iomLoading').classList.remove('hidden');
      _preloadUsers();
    }
  };

  /* ─── 사용자 검색 (로컬 캐시 우선 → API 폴백) ─── */
  window.iomSearchUsers = function() {
    clearTimeout(_searchTimer);
    var word = $('iomUserSearch').value.trim().toLowerCase();
    if (word.length < 1) { _showDeptMembers(); return; }

    // 캐시 있으면 즉시 로컬 검색
    if (_userCache) {
      var selectedIds = {};
      _members.forEach(function(m) { selectedIds[m.knoxId.toLowerCase()] = true; });
      var results = [];
      for (var i = 0; i < _userCache.length; i++) {
        var u = _userCache[i];
        if (selectedIds[u.knoxId.toLowerCase()]) continue;
        if (u.name.toLowerCase().indexOf(word) !== -1 || u.knoxId.toLowerCase().indexOf(word) !== -1) {
          results.push(u);
        }
        if (results.length >= 20) break;
      }
      _renderSearchResults(results);
      return;
    }

    // 캐시 없으면 API 폴백 (debounce)
    _searchTimer = setTimeout(async function() {
      $('iomSearchResults').innerHTML = '<div class="flex items-center justify-center py-3 gap-2 text-[12px] text-[#9ab0ab]"><svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>검색 중...</div>';
      try {
        var token = localStorage.getItem('token');
        var data = await window.gasFetch(window.API_URL + '?action=searchBizFlowUsers&token=' + encodeURIComponent(token) + '&searchWord=' + encodeURIComponent(word));
        if (!data || !data.users) { $('iomSearchResults').innerHTML = ''; return; }
        var selectedIds = {};
        _members.forEach(function(m) { selectedIds[m.knoxId.toLowerCase()] = true; });
        var filtered = data.users.filter(function(u) { return !selectedIds[u.knoxId.toLowerCase()]; });
        _renderSearchResults(filtered);
      } catch (_) { $('iomSearchResults').innerHTML = ''; }
    }, 400);
  };

  function _renderSearchResults(users) {
    var container = $('iomSearchResults');
    if (!users.length) { container.innerHTML = '<div class="text-[11px] text-[#9ab0ab] px-1 py-2">검색 결과가 없어.</div>'; return; }
    container.innerHTML = users.map(function(u) {
      return '<button onclick=\'iomAddMember(' + JSON.stringify(u).replace(/'/g, "\\'") + ')\' class="w-full flex items-center justify-between px-2.5 py-2 rounded-lg hover:bg-accent/10 transition text-left">' +
        '<div><span class="text-[13px] font-medium text-[#47635f]">' + u.name + '</span> <span class="text-[11px] text-[#9ab0ab]">' + u.dept + '</span></div>' +
        '<span class="text-accent text-lg leading-none">+</span></button>';
    }).join('');
  }

  window.iomAddMember = function(user) {
    if (_members.some(function(m) { return m.knoxId.toLowerCase() === user.knoxId.toLowerCase(); })) return;
    _members.push(user);
    _renderSelectedMembers();
    // 검색 결과 유지 (선택된 사람만 업데이트)
    var word = $('iomUserSearch').value.trim().toLowerCase();
    if (word) { iomSearchUsers(); } else { _showDeptMembers(); }
  };

  function _renderSelectedMembers() {
    $('iomSelectedMembers').innerHTML = _members.map(function(m, i) {
      return '<span class="inline-flex items-center gap-1 bg-accent/10 text-accent text-[12px] font-medium px-2.5 py-1 rounded-full">' +
        m.name + '<button onclick="iomRemoveMember(' + i + ')" class="ml-0.5 text-accent/60 hover:text-accent text-sm leading-none">&times;</button></span>';
    }).join('');
  }

  window.iomRemoveMember = function(idx) {
    _members.splice(idx, 1);
    _renderSelectedMembers();
    var word = $('iomUserSearch').value.trim().toLowerCase();
    if (word) { iomSearchUsers(); } else { _showDeptMembers(); }
  };

  /* ─── 세션 생성 ─── */
  window.iomCreate = async function() {
    if (!_members.length) { window.showToast('멤버를 선택해줘!', 'sad'); return; }
    var btn = $('iomSendBtn');
    btn.disabled = true;
    btn.innerHTML = '<svg class="animate-spin h-4 w-4 inline mr-1.5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>발송 중...';
    try {
      var token = localStorage.getItem('token');
      var minutes = $('iomMinutes').value;
      var url = window.API_URL + '?action=createItsOnMe&token=' + encodeURIComponent(token) +
        '&store=' + encodeURIComponent(_store) + '&minutes=' + minutes +
        '&members=' + encodeURIComponent(JSON.stringify(_members));
      if (_customMenus.length) url += '&customMenus=' + encodeURIComponent(JSON.stringify(_customMenus));
      var data = await window.gasFetch(url);
      if (data.error) { window.showToast(data.error, 'sad'); return; }
      // 본인도 메뉴 선택 화면으로
      _currentSessionId = data.sessionId;
      _showOrderView(data.sessionId);
      setTimeout(function() { window.showToast('너도 주문해야지? 메뉴판을 보여줄게', 'smail'); }, 1000);
    } catch (err) {
      window.showToast('발송 실패: ' + err.message, 'sad');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '보내기';
    }
  };

  /* ─── 메뉴 선택 화면 (딥링크 / 생성 후) ─── */
  window.openItsOnMeOrder = function(sessionId) {
    _currentSessionId = sessionId;
    _showOrderView(sessionId);
  };

  async function _showOrderView(sessionId) {
    // 세션마다 메뉴 데이터 초기화 (이전 세션의 바나프레소/커스텀 데이터 혼입 방지)
    _menuData = null;
    _optionsData = null;
    $('iomHome').classList.add('hidden');
    $('iomSetup').classList.add('hidden');
    $('iomOrder').classList.remove('hidden');
    $('iomMenuList').innerHTML = '<div class="text-center py-4 text-[#9ab0ab] text-[13px]">불러오는 중...</div>';
    $('iomOptionArea').classList.add('hidden');
    $('iomSubmitBtn').classList.add('hidden');
    $('iomOrderDone').classList.add('hidden');
    $('iomStatusBar').classList.add('hidden');
    $('iomLastOrder').classList.add('hidden');
    $('iomAddMemberPanel').classList.add('hidden');

    try {
      var token = localStorage.getItem('token');
      var data = await window.gasFetch(window.API_URL + '?action=getItsOnMe&token=' + encodeURIComponent(token) + '&sessionId=' + encodeURIComponent(sessionId));
      if (data.error) { $('iomMenuList').innerHTML = '<div class="text-center py-4 text-danger text-[13px]">' + data.error + '</div>'; return; }

      var session = data.session;
      console.log('[이쏜미] store:', session.store, 'customMenus:', session.customMenus ? session.customMenus.substring(0, 80) : '(empty)');
      _orderSession = session;
      _orderResponses = data.responses || [];
      $('iomOrderStore').textContent = session.store;
      var dl = new Date(session.deadline);
      var dlStr = dl.getHours().toString().padStart(2,'0') + ':' + dl.getMinutes().toString().padStart(2,'0');
      $('iomOrderDeadline').textContent = session.status === 'closed' ? '마감됨' : dlStr + ' 마감';

      // 현황 바
      if (session.status !== 'closed') {
        $('iomStatusBar').classList.remove('hidden');
        $('iomStatusText').textContent = (data.doneCount || 0) + '/' + session.total + '명 선택완료';
      }

      if (session.status === 'closed') {
        var myMenu = data.myResponse.menu || '미선택';
        var myOpts = data.myResponse.options ? ' (' + data.myResponse.options + ')' : '';
        $('iomMenuList').innerHTML = '';
        $('iomOrderDone').classList.remove('hidden');
        $('iomOrderDone').textContent = '마감된 주문이야. 내 선택: ' + myMenu + myOpts;
        return;
      }

      // 이미 선택한 메뉴가 있으면 표시
      if (data.myResponse && data.myResponse.menu) {
        $('iomOrderDone').classList.remove('hidden');
        var optStr = data.myResponse.options ? ' (' + data.myResponse.options + ')' : '';
        $('iomOrderDone').innerHTML = '선택 완료: <strong>' + data.myResponse.menu + optStr + '</strong><br><button onclick="iomChangeMenu()" class="text-[11px] text-accent mt-1 underline">변경하기</button>';
        $('iomMenuList').innerHTML = '';
        return;
      }

      // 먹던대로
      _lastOrder = data.lastOrder;
      if (_lastOrder) {
        var loLabel = _lastOrder.menu + (_lastOrder.options ? ' (' + _lastOrder.options + ')' : '');
        $('iomLastOrderLabel').textContent = loLabel;
        $('iomLastOrder').classList.remove('hidden');
      }

      // 메뉴 로드: 커스텀 메뉴가 있으면 사용, 바나프레소면 API 로드
      if (session.customMenus) {
        try {
          var cm = JSON.parse(session.customMenus);
          _menuData = cm.map(function(m, i) { return { id: i, name: m.name, price: m.price || 0, category: '메뉴', img: '' }; });
          _optionsData = {};
          _renderCustomOrderMenu();
        } catch(_) {
          if (session.store === '당산SKV1 바나프레소') { await _loadMenuData(session.store); }
          else { $('iomMenuList').innerHTML = '<div class="text-center py-4 text-danger text-[13px]">커스텀 메뉴 로드 실패</div>'; }
        }
      } else if (session.store === '당산SKV1 바나프레소') {
        await _loadMenuData(session.store);
      } else {
        $('iomMenuList').innerHTML = '<div class="text-center py-4 text-danger text-[13px]">메뉴 정보가 없어. 발송자에게 문의해줘.</div>';
      }
    } catch (err) {
      $('iomMenuList').innerHTML = '<div class="text-center py-4 text-danger text-[13px]">로드 실패</div>';
    }
  }

  window.iomChangeMenu = function() {
    $('iomOrderDone').classList.add('hidden');
    if (_orderSession && _orderSession.customMenus) {
      _renderCustomOrderMenu();
    } else {
      _renderMenuList();
    }
  };

  /* ─── 메뉴 데이터 로드 (GAS API → 정적 JSON 폴백) ─── */
  async function _loadMenuData(store) {
    if (!_menuData || !_optionsData) {
      try {
        var token = localStorage.getItem('token') || '';
        var res = await window.gasFetch(window.API_URL + '?action=getBanapressoMenu&token=' + encodeURIComponent(token));
        if (res && res.ok && res.menu) {
          _menuData = res.menu;
          _optionsData = res.options || {};
        }
      } catch (_) {}
      // 폴백: 정적 JSON
      if (!_menuData) {
        try { var r1 = await fetch('../data/menu.json'); _menuData = await r1.json(); } catch (_) { _menuData = []; }
      }
      if (!_optionsData) {
        try { var r2 = await fetch('../data/refined_options.json'); _optionsData = await r2.json(); } catch (_) { _optionsData = {}; }
      }
    }
    _renderMenuList();
  }

  /* ─── 수동입력 메뉴 렌더 (수신자용) ─── */
  function _renderCustomOrderMenu() {
    var container = $('iomMenuList');
    $('iomFilterBar').classList.add('hidden');
    $('iomMenuSearchWrap').classList.add('hidden');
    $('iomOptionArea').classList.add('hidden');
    $('iomSubmitBtn').classList.add('hidden');

    if (!_menuData || !_menuData.length) {
      container.innerHTML = '<div class="text-center py-4 text-[#9ab0ab] text-[13px]">메뉴가 없어.</div>';
      return;
    }
    var html = _menuData.map(function(item) {
      return '<button onclick=\'iomPickMenu(' + JSON.stringify({id:item.id,name:item.name,price:item.price}).replace(/'/g,"\\'") + ')\' class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl bg-surface-2 hover:bg-accent/10 transition text-left border border-transparent hover:border-accent/20">' +
        '<div class="text-[13px] font-medium text-[#47635f]">' + item.name + '</div>' +
        (item.price ? '<div class="text-[11px] text-[#9ab0ab]">' + item.price.toLocaleString() + '원</div>' : '') +
      '</button>';
    }).join('');
    // 직접 입력 버튼
    html += '<div class="mt-2 pt-2 border-t border-border">' +
      '<div class="flex gap-2">' +
        '<input id="iomFreeMenuInput" type="text" placeholder="메뉴판에 없으면 직접 입력" class="flex-1 bg-surface-2 border border-border rounded-lg px-3 py-2 text-[12px] text-[#47635f] outline-none focus:border-accent transition placeholder:text-[#9ab0ab]">' +
        '<button onclick="iomPickFreeMenu()" class="shrink-0 px-3 py-2 rounded-lg bg-accent text-white text-[12px] font-semibold hover:brightness-110 transition">선택</button>' +
      '</div></div>';
    container.innerHTML = html;
  }

  window.iomPickFreeMenu = function() {
    var name = ($('iomFreeMenuInput').value || '').trim();
    if (!name) { window.showToast('메뉴명을 입력해줘', 'sad'); return; }
    _selectedMenu = { id: -1, name: name, price: 0 };
    _selectedOptions = {};
    _hideMenuFilters();
    $('iomMenuList').innerHTML = '<div class="bg-accent/10 rounded-xl px-3 py-2.5 text-[13px] font-medium text-accent flex items-center justify-between">' +
      name + ' <button onclick="iomChangeMenu()" class="text-[11px] text-accent/60 underline">다른 메뉴</button></div>';
    $('iomOptionArea').classList.add('hidden');
    $('iomSubmitBtn').classList.remove('hidden');
  };

  /* ─── 즐겨찾기 로드/저장 (localStorage) ─── */
  function _loadFavorites() {
    try { _favorites = JSON.parse(localStorage.getItem('iom_fav') || '{}'); } catch(_) { _favorites = {}; }
  }
  function _saveFavorites() {
    localStorage.setItem('iom_fav', JSON.stringify(_favorites));
  }
  window.iomToggleFav = function(menuId, ev) {
    ev.stopPropagation();
    if (_favorites[menuId]) delete _favorites[menuId]; else _favorites[menuId] = true;
    _saveFavorites();
    _renderCatTabs();
    _renderMenuItems();
  };

  /* ─── 메뉴 검색 ─── */
  window.iomSearchMenu = function() {
    _menuSearchWord = ($('iomMenuSearch').value || '').trim().toLowerCase();
    _renderMenuItems();
  };

  /* ─── 카테고리 필터 탭 ─── */
  function _renderCatTabs() {
    if (!_menuData || !_menuData.length) return;
    var cats = [];
    var seen = {};
    _menuData.forEach(function(m) {
      if (!seen[m.category]) { seen[m.category] = true; cats.push(m.category); }
    });
    var favCount = _menuData.filter(function(m) { return _favorites[m.id]; }).length;
    var tabs = [{ key: '', label: '전체' }];
    if (favCount) tabs.push({ key: '★', label: '★ ' + favCount });
    cats.forEach(function(c) { tabs.push({ key: c, label: c }); });

    $('iomCatTabs').innerHTML = tabs.map(function(t) {
      var active = _currentCat === t.key;
      return '<button onclick="iomFilterCat(\'' + t.key.replace(/'/g,"\\'") + '\')" class="shrink-0 px-3 py-1.5 rounded-full text-[11px] font-semibold whitespace-nowrap transition ' +
        (active ? 'bg-accent text-white' : 'bg-surface-2 text-[#6e7f7b] hover:bg-accent/10') + '">' + t.label + '</button>';
    }).join('');
    $('iomFilterBar').classList.remove('hidden');
  }
  window.iomFilterCat = function(cat) {
    _currentCat = cat;
    _renderCatTabs();
    _renderMenuItems();
  };

  /* ─── 메뉴 목록 렌더 ─── */
  function _renderMenuList() {
    _loadFavorites();
    _menuSearchWord = '';
    var favCount = _menuData ? _menuData.filter(function(m) { return _favorites[m.id]; }).length : 0;
    _currentCat = favCount ? '★' : '';
    var container = $('iomMenuList');
    if (!_menuData || !_menuData.length) {
      container.innerHTML = '<div class="text-center py-4 text-[#9ab0ab] text-[13px]">메뉴를 불러올 수 없어.</div>';
      $('iomFilterBar').classList.add('hidden');
      $('iomMenuSearchWrap').classList.add('hidden');
      return;
    }
    $('iomMenuSearch').value = '';
    $('iomMenuSearchWrap').classList.remove('hidden');
    _renderCatTabs();
    _renderMenuItems();
    $('iomOptionArea').classList.add('hidden');
    $('iomSubmitBtn').classList.add('hidden');
  }

  function _renderMenuItems() {
    var container = $('iomMenuList');
    var filtered = _menuData;
    if (_currentCat === '★') {
      filtered = _menuData.filter(function(m) { return _favorites[m.id]; });
    } else if (_currentCat) {
      filtered = _menuData.filter(function(m) { return m.category === _currentCat; });
    }
    // 텍스트 검색 적용
    if (_menuSearchWord) {
      filtered = filtered.filter(function(m) { return m.name.toLowerCase().indexOf(_menuSearchWord) !== -1; });
    }
    if (!filtered.length) {
      var msg = _menuSearchWord ? '검색 결과가 없어.' : (_currentCat === '★' ? '즐겨찾기한 메뉴가 없어.' : '해당 카테고리에 메뉴가 없어.');
      container.innerHTML = '<div class="text-center py-4 text-[#9ab0ab] text-[13px]">' + msg + '</div>';
      return;
    }
    container.innerHTML = filtered.map(function(item) {
      var isFav = !!_favorites[item.id];
      var imgHtml = item.img ? '<img src="' + item.img + '" alt="" class="w-10 h-10 rounded-lg object-cover shrink-0" onerror="this.style.display=\'none\'">' : '';
      return '<button onclick=\'iomPickMenu(' + JSON.stringify({id:item.id,name:item.name,price:item.price}).replace(/'/g,"\\'") + ')\' class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl bg-surface-2 hover:bg-accent/10 transition text-left border border-transparent hover:border-accent/20">' +
        imgHtml +
        '<div class="flex-1 min-w-0"><div class="text-[13px] font-medium text-[#47635f]">' + item.name + '</div>' +
        '<div class="text-[11px] text-[#9ab0ab]">' + (item.price ? item.price.toLocaleString() + '원' : '') + '</div></div>' +
        '<span onclick="iomToggleFav(' + item.id + ',event)" class="shrink-0 ml-1 w-8 h-8 flex items-center justify-center rounded-full transition ' +
        (isFav ? 'text-red-500 bg-red-50' : 'text-[#c5d5d2] hover:text-red-400 hover:bg-red-50/50') + '">' +
        '<svg class="w-5 h-5" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="' + (isFav ? 'currentColor' : 'none') + '">' +
        '<path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"/></svg>' +
        '</span></button>';
    }).join('');
  }

  /* ─── 메뉴 선택 → 옵션 표시 ─── */
  function _hideMenuFilters() {
    $('iomFilterBar').classList.add('hidden');
    $('iomMenuSearchWrap').classList.add('hidden');
    $('iomLastOrder').classList.add('hidden');
  }
  window.iomPickMenu = function(item) {
    _selectedMenu = item;
    _selectedOptions = {};
    _hideMenuFilters();
    var opts = _optionsData && _optionsData[String(item.id)];
    if (!opts || !opts.length) {
      // 옵션 없음 → 바로 제출 가능
      $('iomOptionArea').classList.add('hidden');
      $('iomSubmitBtn').classList.remove('hidden');
      $('iomMenuList').innerHTML = '<div class="bg-accent/10 rounded-xl px-3 py-2.5 text-[13px] font-medium text-accent">' + item.name + '</div>';
      return;
    }
    // 옵션 렌더링
    $('iomMenuList').innerHTML = '<div class="bg-accent/10 rounded-xl px-3 py-2.5 text-[13px] font-medium text-accent flex items-center justify-between">' + item.name +
      ' <button onclick="iomChangeMenu()" class="text-[11px] text-accent/60 underline">다른 메뉴</button></div>';
    var html = '';
    opts.forEach(function(cat) {
      html += '<div class="mb-3"><div class="text-[11px] font-semibold text-[#6e7f7b] mb-1.5">' + cat.name + (cat.required ? ' *' : '') + '</div>';
      html += '<div class="flex flex-wrap gap-1.5">';
      cat.options.forEach(function(opt) {
        var priceStr = opt.price ? (opt.price > 0 ? '+' + opt.price.toLocaleString() : opt.price.toLocaleString()) + '원' : '';
        html += '<button onclick=\'iomPickOption("' + cat.id + '","' + opt.name + '","' + cat.type + '")\' id="iomOpt_' + cat.id + '_' + opt.name.replace(/\s/g,'_') + '"' +
          ' class="px-2.5 py-1.5 rounded-lg text-[12px] border transition ' +
          (opt.isDefault ? 'bg-accent text-white border-accent' : 'bg-surface-2 text-[#47635f] border-border hover:border-accent/40') + '">' +
          opt.name + (priceStr ? ' <span class="text-[10px] opacity-70">' + priceStr + '</span>' : '') + '</button>';
        if (opt.isDefault) _selectedOptions[cat.id] = opt.name;
      });
      html += '</div></div>';
    });
    $('iomOptionArea').innerHTML = html;
    $('iomOptionArea').classList.remove('hidden');
    $('iomSubmitBtn').classList.remove('hidden');
  };

  window.iomPickOption = function(catId, optName, type) {
    _selectedOptions[catId] = optName;
    // UI 업데이트: 해당 카테고리의 모든 버튼 리셋 후 선택 표시
    var prefix = 'iomOpt_' + catId + '_';
    var allBtns = $('iomOptionArea').querySelectorAll('[id^="' + prefix + '"]');
    allBtns.forEach(function(btn) {
      var isActive = btn.id === prefix + optName.replace(/\s/g,'_');
      btn.className = 'px-2.5 py-1.5 rounded-lg text-[12px] border transition ' +
        (isActive ? 'bg-accent text-white border-accent' : 'bg-surface-2 text-[#47635f] border-border hover:border-accent/40');
    });
  };

  /* ─── 메뉴 제출 ─── */
  window.iomSubmitMenu = async function() {
    if (!_selectedMenu || !_currentSessionId) return;
    var btn = $('iomSubmitBtn');
    btn.disabled = true;
    btn.innerHTML = '<svg class="animate-spin h-4 w-4 inline mr-1.5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>저장 중...';
    try {
      var token = localStorage.getItem('token');
      var optStr = Object.values(_selectedOptions).filter(Boolean).join(', ');
      var data = await window.gasFetch(window.API_URL + '?action=submitItsOnMeMenu&token=' + encodeURIComponent(token) +
        '&sessionId=' + encodeURIComponent(_currentSessionId) +
        '&menu=' + encodeURIComponent(_selectedMenu.name) +
        '&options=' + encodeURIComponent(optStr) +
        '&price=' + (_selectedMenu.price || 0));
      if (data.error) { window.showToast(data.error, 'sad'); return; }
      var doneText = '선택 완료: <strong>' + _selectedMenu.name + (optStr ? ' (' + optStr + ')' : '') + '</strong>';
      if (data.allDone) doneText += '<br><span class="text-[11px] text-[#9ab0ab]">전원 선택 완료! 취합 결과가 발송됐어.</span>';
      else doneText += '<br><button onclick="iomChangeMenu()" class="text-[11px] text-accent mt-1 underline">변경하기</button>';
      $('iomOrderDone').innerHTML = doneText;
      $('iomOrderDone').classList.remove('hidden');
      $('iomMenuList').innerHTML = '';
      $('iomOptionArea').classList.add('hidden');
      $('iomSubmitBtn').classList.add('hidden');
      window.showToast('메뉴 선택 완료!', 'smail');
    } catch (err) {
      window.showToast('저장 실패', 'sad');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '선택 완료';
    }
  };

  /* ─── 먹던대로 ─── */
  window.iomUseLastOrder = function() {
    if (!_lastOrder || !_lastOrder.menu) return;
    // 메뉴 데이터에서 매칭
    var found = _menuData && _menuData.find(function(m) { return m.name === _lastOrder.menu; });
    _selectedMenu = found ? { id: found.id, name: found.name, price: found.price } : { id: 0, name: _lastOrder.menu, price: _lastOrder.price || 0 };
    _selectedOptions = {};
    if (_lastOrder.options) {
      _lastOrder.options.split(',').forEach(function(o, i) { _selectedOptions['last_' + i] = o.trim(); });
    }
    $('iomLastOrder').classList.add('hidden');
    _hideMenuFilters();
    $('iomMenuList').innerHTML = '<div class="bg-accent/10 rounded-xl px-3 py-2.5 text-[13px] font-medium text-accent flex items-center justify-between">' +
      _selectedMenu.name + (_lastOrder.options ? ' <span class="text-[11px] text-accent/60">(' + _lastOrder.options + ')</span>' : '') +
      ' <button onclick="iomChangeMenu()" class="text-[11px] text-accent/60 underline">다른 메뉴</button></div>';
    $('iomOptionArea').classList.add('hidden');
    $('iomSubmitBtn').classList.remove('hidden');
  };

  /* ─── 시간 연장 (+10분) ─── */
  window.iomExtendTime = async function() {
    if (!_currentSessionId) return;
    if (!confirm('마감시간을 10분 연장할까?')) return;
    try {
      var token = localStorage.getItem('token');
      var data = await window.gasFetch(window.API_URL + '?action=extendItsOnMe&token=' + encodeURIComponent(token) +
        '&sessionId=' + encodeURIComponent(_currentSessionId) + '&minutes=10');
      if (data.error) { window.showToast(data.error, 'sad'); return; }
      $('iomOrderDeadline').textContent = data.deadlineStr + ' 마감';
      window.showToast(data.deadlineStr + '까지 연장했어!', 'smail');
    } catch (_) { window.showToast('연장 실패', 'sad'); }
  };

  /* ─── 멤버 추가 (참여자도 가능) ─── */
  window.iomShowAddMember = function() {
    var panel = $('iomAddMemberPanel');
    if (!panel.classList.contains('hidden')) { panel.classList.add('hidden'); return; }
    $('iomAddMemberSearch').value = '';
    $('iomAddMemberResults').innerHTML = '';
    panel.classList.remove('hidden');
    $('iomAddMemberSearch').focus();
  };

  window.iomAddMemberSearchFn = function() {
    var word = ($('iomAddMemberSearch').value || '').trim().toLowerCase();
    if (word.length < 1) { $('iomAddMemberResults').innerHTML = ''; return; }
    if (!_userCache) { $('iomAddMemberResults').innerHTML = '<div class="text-[11px] text-[#9ab0ab] py-1">사용자 목록 로드 중...</div>'; return; }
    // 기존 멤버 제외
    var existingKnox = {};
    _orderResponses.forEach(function(r) { existingKnox[r.knoxId.toLowerCase()] = true; });
    var results = _userCache.filter(function(u) {
      if (existingKnox[u.knoxId.toLowerCase()]) return false;
      return u.name.toLowerCase().indexOf(word) !== -1 || u.knoxId.toLowerCase().indexOf(word) !== -1;
    }).slice(0, 10);
    if (!results.length) { $('iomAddMemberResults').innerHTML = '<div class="text-[11px] text-[#9ab0ab] py-1">결과 없음</div>'; return; }
    $('iomAddMemberResults').innerHTML = results.map(function(u) {
      return '<button onclick=\'iomAddNewMember(' + JSON.stringify(u).replace(/'/g, "\\'") + ')\' class="w-full flex items-center justify-between px-2 py-1.5 rounded hover:bg-accent/10 transition text-left">' +
        '<span class="text-[12px] text-[#47635f]">' + u.name + ' <span class="text-[10px] text-[#9ab0ab]">' + u.dept + '</span></span>' +
        '<span class="text-accent text-sm">+</span></button>';
    }).join('');
  };

  window.iomAddNewMember = async function(user) {
    if (!_currentSessionId) return;
    try {
      var token = localStorage.getItem('token');
      var data = await window.gasFetch(window.API_URL + '?action=addItsOnMeMembers&token=' + encodeURIComponent(token) +
        '&sessionId=' + encodeURIComponent(_currentSessionId) +
        '&members=' + encodeURIComponent(JSON.stringify([user])));
      if (data.error) { window.showToast(data.error, 'sad'); return; }
      if (data.addedCount > 0) {
        _orderResponses.push({ knoxId: user.knoxId, name: user.name, menu: '', options: '' });
        var newTotal = (_orderSession ? _orderSession.total : 0) + data.addedCount;
        if (_orderSession) _orderSession.total = newTotal;
        var doneCount = _orderResponses.filter(function(r) { return r.menu; }).length;
        $('iomStatusText').textContent = doneCount + '/' + newTotal + '명 선택완료';
        window.showToast(user.name + ' 추가 완료!', 'smail');
        $('iomAddMemberSearch').value = '';
        $('iomAddMemberResults').innerHTML = '';
      } else {
        window.showToast('이미 참여 중인 멤버야.', 'smail');
      }
    } catch (_) { window.showToast('추가 실패', 'sad'); }
  };
})();
</script>

        <div class="text-sm font-semibold">투표</div>
        <div class="text-[11px] text-[#6e7f7b]">팀원들과 빠르게 의견 모으기</div>
      </div>
    </div>

    <!-- 투표 홈 -->
    <div id="voteHome">
      <button onclick="voteOpenSetup()" class="w-full flex items-center justify-center gap-2 bg-surface-2 rounded-xl py-4 px-3 hover:bg-accent/10 transition border border-transparent hover:border-accent/20">
        <span class="text-lg">+</span>
        <span class="text-[12px] font-semibold text-[#47635f]">새 투표 만들기</span>
      </button>
    </div>

    <!-- 투표 설정 -->
    <div id="voteSetup" class="hidden">
      <div class="flex items-center gap-2 mb-3">
        <button onclick="voteBack('home')" class="w-7 h-7 rounded-full bg-surface-2 flex items-center justify-center text-[#6e7f7b] hover:text-accent transition shrink-0">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
        </button>
        <div class="text-sm font-semibold">새 투표</div>
      </div>

      <!-- 저장된 템플릿 -->
      <div id="voteTplArea" class="mb-3">
        <div class="text-[11px] text-[#6e7f7b] mb-1.5">저장된 투표</div>
        <div id="voteTplList" class="space-y-1.5 max-h-36 overflow-y-auto"></div>
      </div>

      <!-- 제목 -->
      <div class="mb-3">
        <div class="text-[11px] text-[#6e7f7b] mb-1.5">제목</div>
        <input id="voteTitle" type="text" placeholder="예: 점심 뭐 먹을까?"
          class="w-full bg-surface-2 border border-border rounded-lg px-3 py-2.5 text-sm text-[#47635f] outline-none focus:border-accent transition placeholder:text-[#6e7f7b]/60">
      </div>

      <!-- 항목 추가 -->
      <div class="mb-3">
        <div class="text-[11px] text-[#6e7f7b] mb-1.5">항목</div>
        <div class="flex gap-2 mb-2">
          <input id="voteNewItem" type="text" placeholder="항목 입력" onkeydown="if(event.key==='Enter'){voteAddItem();event.preventDefault();}"
            class="flex-1 bg-surface-2 border border-border rounded-lg px-3 py-2 text-[13px] text-[#47635f] outline-none focus:border-accent transition placeholder:text-[#6e7f7b]/60">
          <button onclick="voteAddItem()" class="shrink-0 px-3 h-9 rounded-lg bg-accent text-white text-[12px] font-semibold flex items-center justify-center hover:brightness-110 transition">추가</button>
        </div>
        <div id="voteItemList" class="space-y-1.5"></div>
      </div>

      <!-- 옵션 토글 -->
      <div class="mb-3 space-y-2">
        <div class="text-[11px] text-[#6e7f7b] mb-1">옵션</div>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="voteOptMulti" class="accent-[#2d8a7e] w-4 h-4">
          <span class="text-[12px] text-[#47635f]">복수 선택 허용</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="voteOptAnon" class="accent-[#2d8a7e] w-4 h-4">
          <span class="text-[12px] text-[#47635f]">익명 투표</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="voteOptAddable" checked class="accent-[#2d8a7e] w-4 h-4">
          <span class="text-[12px] text-[#47635f]">항목 추가 허용</span>
        </label>
      </div>

      <!-- 마감시간 -->
      <div class="mb-4">
        <div class="text-[11px] text-[#6e7f7b] mb-1.5">마감시간</div>
        <div class="flex items-center gap-3">
          <input id="voteMinutes" type="range" min="10" max="120" step="5" value="30" oninput="document.getElementById('voteMinLabel').textContent=this.value+'분 후'"
            class="flex-1 accent-[#2d8a7e]">
          <span id="voteMinLabel" class="text-sm font-mono font-semibold text-[#47635f] w-16 text-right">30분 후</span>
        </div>
      </div>

      <button onclick="voteNext()" class="w-full py-2.5 rounded-lg bg-[#47635f] text-white font-semibold text-sm hover:brightness-110 transition">
        다음
      </button>
    </div>

    <!-- 멤버 선택 -->
    <div id="voteMemberSelect" class="hidden">
      <div class="flex items-center gap-2 mb-3">
        <button onclick="voteBack('setup')" class="w-7 h-7 rounded-full bg-surface-2 flex items-center justify-center text-[#6e7f7b] hover:text-accent transition shrink-0">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
        </button>
        <div class="text-sm font-semibold">멤버 선택</div>
      </div>

      <div class="mb-3">
        <div class="relative">
          <input id="voteUserSearch" type="text" placeholder="이름 또는 ID로 검색" oninput="voteSearchUsers()"
            class="w-full bg-surface-2 border border-border rounded-lg px-3 py-2.5 text-sm text-[#47635f] outline-none focus:border-accent transition placeholder:text-[#6e7f7b]/60">
        </div>
        <div id="voteSearchResults" class="mt-1 max-h-32 overflow-y-auto"></div>
        <div id="voteSelectedMembers" class="flex flex-wrap gap-1.5 mt-2"></div>
      </div>

      <button onclick="voteCreate()" id="voteCreateBtn" class="w-full py-2.5 rounded-lg bg-accent text-white font-semibold text-sm hover:brightness-110 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
        투표 시작
      </button>
    </div>

    <!-- 투표 화면 (참여 / 결과) -->
    <div id="voteView" class="hidden">
      <div class="flex items-center gap-2 mb-3">
        <button onclick="voteBack('home')" class="w-7 h-7 rounded-full bg-surface-2 flex items-center justify-center text-[#6e7f7b] hover:text-accent transition shrink-0">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
        </button>
        <div class="text-sm font-semibold" id="voteViewTitle"></div>
      </div>

      <!-- 상태 바 -->
      <div class="flex items-center justify-between mb-3">
        <span id="voteStatusText" class="text-[11px] text-[#6e7f7b]"></span>
        <span id="voteDeadlineText" class="text-[11px] text-accent font-mono"></span>
      </div>

      <!-- 투표 폼 -->
      <div id="voteFormArea">
        <div id="voteChoices" class="space-y-2 mb-3"></div>
        <button onclick="voteSubmit()" id="voteSubmitBtn" class="w-full py-2.5 rounded-lg bg-accent text-white font-semibold text-sm hover:brightness-110 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
          투표하기
        </button>
      </div>

      <!-- 항목 추가 (허용 시) -->
      <div id="voteAddArea" class="hidden mt-3">
        <div class="flex gap-2">
          <input id="voteAddItemInput" type="text" placeholder="새 항목 추가" onkeydown="if(event.key==='Enter'){voteAddNewItem();event.preventDefault();}"
            class="flex-1 bg-surface-2 border border-border rounded-lg px-3 py-2 text-[13px] text-[#47635f] outline-none focus:border-accent transition placeholder:text-[#6e7f7b]/60">
          <button onclick="voteAddNewItem()" class="shrink-0 px-3 h-9 rounded-lg bg-accent text-white text-[12px] font-semibold hover:brightness-110 transition">추가</button>
        </div>
      </div>

      <!-- 결과 영역 -->
      <div id="voteResultArea" class="mt-4"></div>

      <!-- 마감 버튼 (생성자만) -->
      <div id="voteCloseArea" class="hidden mt-3">
        <button onclick="voteClose()" class="w-full py-2 rounded-lg bg-red-500/10 text-red-500 font-semibold text-[12px] hover:bg-red-500/20 transition">
          투표 마감
        </button>
      </div>

      <!-- 멤버 추가 (생성자만, 진행중) -->
      <div id="voteAddMemberArea" class="hidden mt-3 border-t border-border pt-3">
        <div class="text-[11px] text-[#6e7f7b] mb-1.5">멤버 추가</div>
        <div class="flex gap-2">
          <input id="voteAddMemberSearch" type="text" placeholder="이름 검색" oninput="voteSearchAddMember()"
            class="flex-1 bg-surface-2 border border-border rounded-lg px-3 py-2 text-[13px] text-[#47635f] outline-none focus:border-accent transition placeholder:text-[#6e7f7b]/60">
        </div>
        <div id="voteAddMemberResults" class="mt-1 max-h-24 overflow-y-auto"></div>
      </div>
    </div>

  </div>
</section>

<script>
(function() {
  var $ = function(id) { return document.getElementById(id); };
  var _voteItems = [];
  var _voteMembers = [];
  var _voteSession = null;
  var _voteMyResponse = null;
  var _voteIsCreator = false;
  var _voteTplFavorites = JSON.parse(localStorage.getItem('voteTplFav') || '[]');
  var _voteTimer = null;

  /* ═══════════════ 네비게이션 ═══════════════ */

  function _voteShowOnly(id) {
    ['voteHome','voteSetup','voteMemberSelect','voteView'].forEach(function(s) {
      $(s).classList.toggle('hidden', s !== id);
    });
  }

  window.voteBack = function(target) {
    if (_voteTimer) { clearInterval(_voteTimer); _voteTimer = null; }
    if (target === 'home') {
      _voteShowOnly('voteHome');
      _voteItems = [];
      _voteMembers = [];
      _voteSession = null;
    } else if (target === 'setup') {
      _voteShowOnly('voteSetup');
    }
  };

  window.voteOpenSetup = function() {
    _voteItems = [];
    $('voteTitle').value = '';
    $('voteNewItem').value = '';
    $('voteItemList').innerHTML = '';
    $('voteOptMulti').checked = false;
    $('voteOptAnon').checked = false;
    $('voteOptAddable').checked = true;
    $('voteMinutes').value = 30;
    $('voteMinLabel').textContent = '30분 후';
    _voteShowOnly('voteSetup');
    _loadVoteTemplates();
  };

  /* ═══════════════ 항목 관리 ═══════════════ */

  window.voteAddItem = function() {
    var input = $('voteNewItem');
    var val = input.value.trim();
    if (!val) return;
    if (_voteItems.indexOf(val) !== -1) { window.showToast('이미 있는 항목이야.', 'sad'); return; }
    _voteItems.push(val);
    input.value = '';
    input.focus();
    _renderVoteItems();
  };

  function _renderVoteItems() {
    var list = $('voteItemList');
    list.innerHTML = _voteItems.map(function(item, i) {
      return '<div class="flex items-center gap-2 bg-surface-2 rounded-lg px-3 py-2">' +
        '<span class="flex-1 text-[13px] text-[#47635f]">' + _esc(item) + '</span>' +
        '<button onclick="voteRemoveItem(' + i + ')" class="text-[#6e7f7b] hover:text-red-400 transition text-[16px] leading-none">&times;</button>' +
        '</div>';
    }).join('');
  }

  window.voteRemoveItem = function(i) {
    _voteItems.splice(i, 1);
    _renderVoteItems();
  };

  /* ═══════════════ 템플릿 ═══════════════ */

  async function _loadVoteTemplates() {
    var area = $('voteTplArea');
    var list = $('voteTplList');
    list.innerHTML = '<div class="text-[11px] text-[#9ab0ab] py-2 text-center">불러오는 중...</div>';
    try {
      var token = localStorage.getItem('token');
      var data = await window.gasFetch(window.API_URL + '?action=getVoteTemplates&token=' + encodeURIComponent(token));
      if (!data.templates || !data.templates.length) {
        list.innerHTML = '<div class="text-[11px] text-[#9ab0ab] py-2 text-center">저장된 투표가 없어</div>';
        return;
      }
      var tpls = data.templates.slice();
      tpls.sort(function(a, b) {
        var af = _voteTplFavorites.indexOf(a.title) !== -1 ? 0 : 1;
        var bf = _voteTplFavorites.indexOf(b.title) !== -1 ? 0 : 1;
        if (af !== bf) return af - bf;
        if (a.isMine !== b.isMine) return a.isMine ? -1 : 1;
        return 0;
      });
      list.innerHTML = tpls.map(function(t) {
        var isFav = _voteTplFavorites.indexOf(t.title) !== -1;
        var items = [];
        try { items = JSON.parse(t.items); } catch(_) {}
        var ownerTag = t.isMine ? '' : ' <span class="text-[10px] text-[#9ab0ab]">by ' + _esc(t.ownerName) + '</span>';
        var deleteBtn = t.isMine ? '<button onclick="event.stopPropagation();voteDeleteTpl(\'' + _esc(t.title).replace(/'/g, "\\'") + '\')" class="text-[#6e7f7b] hover:text-red-400 transition text-[14px] leading-none shrink-0">&times;</button>' : '';
        return '<div class="flex items-center gap-2 bg-surface-2 rounded-lg px-3 py-2 cursor-pointer hover:bg-accent/10 transition" onclick="voteLoadTpl(this)" data-title="' + _esc(t.title) + '" data-items=\'' + _esc(t.items) + '\' data-options=\'' + _esc(t.options || '{}') + '\'>' +
          '<button onclick="event.stopPropagation();voteToggleTplFav(\'' + _esc(t.title).replace(/'/g, "\\'") + '\')" class="text-[14px] shrink-0 ' + (isFav ? 'text-yellow-400' : 'text-[#ccc]') + '">' + (isFav ? '★' : '☆') + '</button>' +
          '<div class="flex-1 min-w-0"><div class="text-[12px] font-semibold text-[#47635f] truncate">' + _esc(t.title) + ownerTag + '</div>' +
          '<div class="text-[10px] text-[#9ab0ab] truncate">' + items.join(', ') + '</div></div>' +
          deleteBtn + '</div>';
      }).join('');
    } catch (_) {
      list.innerHTML = '<div class="text-[11px] text-[#9ab0ab] py-2 text-center">템플릿 로드 실패</div>';
    }
  }

  window.voteLoadTpl = function(el) {
    var title = el.dataset.title;
    var items = [];
    try { items = JSON.parse(el.dataset.items); } catch(_) {}
    var opts = {};
    try { opts = JSON.parse(el.dataset.options); } catch(_) {}
    $('voteTitle').value = title;
    _voteItems = items.slice();
    _renderVoteItems();
    $('voteOptMulti').checked = !!opts.multi;
    $('voteOptAnon').checked = !!opts.anon;
    $('voteOptAddable').checked = opts.addable !== false;
  };

  window.voteToggleTplFav = function(title) {
    var idx = _voteTplFavorites.indexOf(title);
    if (idx === -1) _voteTplFavorites.push(title);
    else _voteTplFavorites.splice(idx, 1);
    localStorage.setItem('voteTplFav', JSON.stringify(_voteTplFavorites));
    _loadVoteTemplates();
  };

  window.voteDeleteTpl = async function(title) {
    if (!confirm('"' + title + '" 템플릿을 삭제할까?')) return;
    try {
      var token = localStorage.getItem('token');
      await window.gasFetch(window.API_URL + '?action=deleteVoteTemplate&token=' + encodeURIComponent(token) + '&title=' + encodeURIComponent(title));
      window.showToast('삭제 완료', 'smail');
      _loadVoteTemplates();
    } catch (_) { window.showToast('삭제 실패', 'sad'); }
  };

  async function _autoSaveVoteTpl() {
    var title = $('voteTitle').value.trim();
    if (!title || _voteItems.length < 2) return;
    var opts = { multi: $('voteOptMulti').checked, anon: $('voteOptAnon').checked, addable: $('voteOptAddable').checked };
    try {
      var token = localStorage.getItem('token');
      await window.gasFetch(window.API_URL + '?action=saveVoteTemplate&token=' + encodeURIComponent(token) +
        '&title=' + encodeURIComponent(title) + '&items=' + encodeURIComponent(JSON.stringify(_voteItems)) +
        '&options=' + encodeURIComponent(JSON.stringify(opts)));
    } catch (_) {}
  }

  /* ═══════════════ 다음 → 멤버 선택 ═══════════════ */

  window.voteNext = async function() {
    var title = $('voteTitle').value.trim();
    if (!title) { window.showToast('제목을 입력해줘.', 'sad'); return; }
    if (_voteItems.length < 2) { window.showToast('항목을 2개 이상 추가해줘.', 'sad'); return; }
    // 자동 저장
    await _autoSaveVoteTpl();
    _voteMembers = [];
    $('voteSelectedMembers').innerHTML = '';
    $('voteUserSearch').value = '';
    $('voteSearchResults').innerHTML = '';
    $('voteCreateBtn').disabled = true;
    _voteShowOnly('voteMemberSelect');
    // 유저 캐시 로드
    if (!window._iomUserCache || !window._iomUserCache.length) {
      try {
        var token = localStorage.getItem('token');
        var data = await window.gasFetch(window.API_URL + '?action=getTeamMembers&token=' + encodeURIComponent(token));
        window._iomUserCache = data.members || [];
      } catch (_) { window._iomUserCache = []; }
    }
  };

  /* ═══════════════ 멤버 검색/선택 ═══════════════ */

  window.voteSearchUsers = function() {
    var q = $('voteUserSearch').value.trim().toLowerCase();
    var box = $('voteSearchResults');
    if (!q || q.length < 1) { box.innerHTML = ''; return; }
    var myKnox = (window._myKnoxId || '').toLowerCase();
    var results = (window._iomUserCache || []).filter(function(u) {
      if (u.knoxId.toLowerCase() === myKnox) return false;
      if (_voteMembers.some(function(m) { return m.knoxId === u.knoxId; })) return false;
      return u.name.toLowerCase().indexOf(q) !== -1 || u.knoxId.toLowerCase().indexOf(q) !== -1;
    }).slice(0, 8);
    box.innerHTML = results.map(function(u) {
      return '<button onclick="voteSelectMember(\'' + u.knoxId + '\',\'' + _esc(u.name) + '\')" class="w-full text-left px-3 py-2 text-[13px] text-[#47635f] hover:bg-accent/10 rounded-lg transition">' + _esc(u.name) + ' <span class="text-[#9ab0ab]">' + u.knoxId + '</span></button>';
    }).join('');
  };

  window.voteSelectMember = function(knoxId, name) {
    if (_voteMembers.some(function(m) { return m.knoxId === knoxId; })) return;
    _voteMembers.push({ knoxId: knoxId, name: name });
    $('voteUserSearch').value = '';
    $('voteSearchResults').innerHTML = '';
    _renderVoteMembers();
  };

  function _renderVoteMembers() {
    var box = $('voteSelectedMembers');
    box.innerHTML = _voteMembers.map(function(m, i) {
      return '<span class="inline-flex items-center gap-1 bg-accent/10 text-accent rounded-full px-2.5 py-1 text-[12px]">' +
        _esc(m.name) +
        '<button onclick="voteRemoveMember(' + i + ')" class="hover:text-red-400 transition text-[14px] leading-none">&times;</button>' +
        '</span>';
    }).join('');
    $('voteCreateBtn').disabled = _voteMembers.length === 0;
  }

  window.voteRemoveMember = function(i) {
    _voteMembers.splice(i, 1);
    _renderVoteMembers();
  };

  /* ═══════════════ 투표 생성 ═══════════════ */

  window.voteCreate = async function() {
    var btn = $('voteCreateBtn');
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '생성중...';
    try {
      var token = localStorage.getItem('token');
      var opts = { multi: $('voteOptMulti').checked, anon: $('voteOptAnon').checked, addable: $('voteOptAddable').checked };
      var data = await window.gasFetch(window.API_URL + '?action=createVote&token=' + encodeURIComponent(token) +
        '&title=' + encodeURIComponent($('voteTitle').value.trim()) +
        '&items=' + encodeURIComponent(JSON.stringify(_voteItems)) +
        '&minutes=' + $('voteMinutes').value +
        '&members=' + encodeURIComponent(JSON.stringify(_voteMembers)) +
        '&options=' + encodeURIComponent(JSON.stringify(opts)));
      if (data.error) { window.showToast(data.error, 'sad'); btn.disabled = false; btn.textContent = '투표 시작'; return; }
      window.showToast('투표가 시작됐어!', 'smail');
      if (data.failedUsers && data.failedUsers.length) {
        window.showToast(data.failedUsers.join(', ') + ' 알림 실패', 'sad');
      }
      window.openVoteView(data.sessionId);
    } catch (e) {
      window.showToast('투표 생성 실패', 'sad');
      btn.disabled = false;
      btn.textContent = '투표 시작';
    }
  };

  /* ═══════════════ 투표 화면 열기 ═══════════════ */

  window.openVoteView = async function(sessionId) {
    _voteShowOnly('voteView');
    $('voteViewTitle').textContent = '투표';
    $('voteStatusText').textContent = '불러오는 중...';
    $('voteDeadlineText').textContent = '';
    $('voteChoices').innerHTML = '';
    $('voteResultArea').innerHTML = '';
    $('voteFormArea').classList.add('hidden');
    $('voteAddArea').classList.add('hidden');
    $('voteCloseArea').classList.add('hidden');
    $('voteAddMemberArea').classList.add('hidden');
    $('voteSubmitBtn').disabled = true;

    try {
      var token = localStorage.getItem('token');
      var data = await window.gasFetch(window.API_URL + '?action=getVote&token=' + encodeURIComponent(token) + '&sessionId=' + encodeURIComponent(sessionId));
      if (data.error) { window.showToast(data.error, 'sad'); voteBack('home'); return; }
      _voteSession = data.session;
      _voteMyResponse = data.myResponse;
      _voteIsCreator = data.isCreator;
      _renderVoteView(data);
    } catch (e) {
      window.showToast('투표 로드 실패', 'sad');
      voteBack('home');
    }
  };

  function _renderVoteView(data) {
    var s = data.session;
    var items = [];
    try { items = JSON.parse(s.items); } catch(_) {}
    var opts = s.options || {};
    var isClosed = s.status === 'closed';
    var hasVoted = !!(_voteMyResponse && _voteMyResponse.choices);
    var myChoices = [];
    if (hasVoted) { try { myChoices = JSON.parse(_voteMyResponse.choices); } catch(_) {} }

    $('voteViewTitle').textContent = s.title;
    $('voteStatusText').textContent = data.votedCount + '/' + s.total + '명 투표완료';

    // 타이머
    if (_voteTimer) clearInterval(_voteTimer);
    if (!isClosed) {
      var dl = new Date(s.deadline);
      function _updateTimer() {
        var remain = dl.getTime() - Date.now();
        if (remain <= 0) {
          $('voteDeadlineText').textContent = '마감됨';
          clearInterval(_voteTimer);
          _voteTimer = null;
          // 자동 새로고침
          window.openVoteView(_voteSession.sessionId);
          return;
        }
        var m = Math.floor(remain / 60000);
        var sec = Math.floor((remain % 60000) / 1000);
        $('voteDeadlineText').textContent = m + ':' + (sec < 10 ? '0' : '') + sec + ' 남음';
      }
      _updateTimer();
      _voteTimer = setInterval(_updateTimer, 1000);
    } else {
      $('voteDeadlineText').textContent = '마감됨';
    }

    // 투표 폼 (미투표 + 진행중)
    if (!isClosed && !hasVoted) {
      $('voteFormArea').classList.remove('hidden');
      var isMulti = !!opts.multi;
      var inputType = isMulti ? 'checkbox' : 'radio';
      $('voteChoices').innerHTML = items.map(function(item, i) {
        return '<label class="flex items-center gap-3 bg-surface-2 rounded-lg px-3 py-3 cursor-pointer hover:bg-accent/10 transition">' +
          '<input type="' + inputType + '" name="voteChoice" value="' + _esc(item) + '" class="accent-[#2d8a7e] w-4 h-4" onchange="voteOnChoiceChange()">' +
          '<span class="text-[13px] text-[#47635f]">' + _esc(item) + '</span>' +
          '</label>';
      }).join('');
      $('voteSubmitBtn').disabled = true;
    } else {
      $('voteFormArea').classList.add('hidden');
    }

    // 항목 추가
    if (!isClosed && opts.addable) {
      $('voteAddArea').classList.remove('hidden');
      $('voteAddItemInput').value = '';
    } else {
      $('voteAddArea').classList.add('hidden');
    }

    // 결과 표시
    _renderVoteResults(data, items, opts, isClosed, hasVoted, myChoices);

    // 마감 버튼 (생성자 + 진행중)
    if (_voteIsCreator && !isClosed) {
      $('voteCloseArea').classList.remove('hidden');
    } else {
      $('voteCloseArea').classList.add('hidden');
    }

    // 멤버 추가 영역 (진행중에만 표시하지 않음 - 이쏜미와 다르게 투표는 멤버 추가 불가)
    $('voteAddMemberArea').classList.add('hidden');
  }

  function _renderVoteResults(data, items, opts, isClosed, hasVoted, myChoices) {
    var area = $('voteResultArea');
    var tally = data.tally;
    var isAnon = !!opts.anon;

    // 익명 + 진행중이면 결과 비노출
    if (isAnon && !isClosed) {
      if (hasVoted) {
        area.innerHTML = '<div class="text-[12px] text-[#9ab0ab] text-center py-3">익명 투표는 마감 후 결과를 확인할 수 있어.</div>';
        // 내 선택 표시
        if (myChoices.length) {
          area.innerHTML += '<div class="text-[11px] text-[#6e7f7b] mt-2">내 선택: ' + myChoices.map(_esc).join(', ') + '</div>';
        }
      }
      return;
    }

    if (!tally && !isClosed) return;
    if (!tally) tally = {};

    // 총 투표수
    var totalVotes = 0;
    for (var k in tally) totalVotes += tally[k].count;

    var html = '<div class="text-[11px] text-[#6e7f7b] mb-2">' + (isClosed ? '최종 결과' : '실시간 현황') + '</div>';
    html += '<div class="space-y-2">';
    items.forEach(function(item) {
      var entry = tally[item] || { count: 0, names: [] };
      var pct = totalVotes > 0 ? Math.round(entry.count / totalVotes * 100) : 0;
      var isMyChoice = myChoices.indexOf(item) !== -1;
      var nameStr = (!isAnon && entry.names && entry.names.length) ? '<div class="text-[10px] text-[#9ab0ab] mt-0.5">' + entry.names.map(_esc).join(', ') + '</div>' : '';
      html += '<div class="bg-surface-2 rounded-lg px-3 py-2 relative overflow-hidden">' +
        '<div class="absolute inset-0 bg-accent/10 rounded-lg" style="width:' + pct + '%"></div>' +
        '<div class="relative flex items-center justify-between">' +
        '<span class="text-[12px] text-[#47635f]' + (isMyChoice ? ' font-bold' : '') + '">' + _esc(item) + (isMyChoice ? ' ✓' : '') + '</span>' +
        '<span class="text-[11px] text-[#6e7f7b] font-mono">' + entry.count + '표 (' + pct + '%)</span>' +
        '</div>' + nameStr + '</div>';
    });
    html += '</div>';

    // 투표 완료 메시지
    if (hasVoted && !isClosed) {
      html += '<div class="text-[11px] text-[#9ab0ab] text-center mt-3">투표 완료! 결과는 실시간으로 업데이트돼.</div>';
    }

    area.innerHTML = html;
  }

  /* ═══════════════ 투표 선택 변경 ═══════════════ */

  window.voteOnChoiceChange = function() {
    var checked = document.querySelectorAll('#voteChoices input:checked');
    $('voteSubmitBtn').disabled = checked.length === 0;
  };

  /* ═══════════════ 투표 제출 ═══════════════ */

  window.voteSubmit = async function() {
    var checked = document.querySelectorAll('#voteChoices input:checked');
    if (!checked.length) return;
    var choices = [];
    checked.forEach(function(el) { choices.push(el.value); });

    if (!confirm(choices.join(', ') + '\n\n이대로 투표할까? (변경 불가)')) return;

    var btn = $('voteSubmitBtn');
    btn.disabled = true;
    btn.textContent = '제출중...';
    try {
      var token = localStorage.getItem('token');
      var data = await window.gasFetch(window.API_URL + '?action=submitVote&token=' + encodeURIComponent(token) +
        '&sessionId=' + encodeURIComponent(_voteSession.sessionId) +
        '&choices=' + encodeURIComponent(JSON.stringify(choices)));
      if (data.error) { window.showToast(data.error, 'sad'); btn.disabled = false; btn.textContent = '투표하기'; return; }
      window.showToast('투표 완료!', 'smail');
      // 새로고침
      window.openVoteView(_voteSession.sessionId);
    } catch (e) {
      window.showToast('투표 실패', 'sad');
      btn.disabled = false;
      btn.textContent = '투표하기';
    }
  };

  /* ═══════════════ 항목 추가 (진행중) ═══════════════ */

  window.voteAddNewItem = async function() {
    var input = $('voteAddItemInput');
    var val = input.value.trim();
    if (!val) return;
    try {
      var token = localStorage.getItem('token');
      var data = await window.gasFetch(window.API_URL + '?action=addVoteItem&token=' + encodeURIComponent(token) +
        '&sessionId=' + encodeURIComponent(_voteSession.sessionId) +
        '&item=' + encodeURIComponent(val));
      if (data.error) { window.showToast(data.error, 'sad'); return; }
      window.showToast('항목 추가 + 자동 투표됨!', 'smail');
      input.value = '';
      window.openVoteView(_voteSession.sessionId);
    } catch (_) { window.showToast('추가 실패', 'sad'); }
  };

  /* ═══════════════ 투표 마감 ═══════════════ */

  window.voteClose = async function() {
    if (!confirm('투표를 마감할까? 결과가 전원에게 발송돼.')) return;
    try {
      var token = localStorage.getItem('token');
      var data = await window.gasFetch(window.API_URL + '?action=closeVote&token=' + encodeURIComponent(token) +
        '&sessionId=' + encodeURIComponent(_voteSession.sessionId));
      if (data.error) { window.showToast(data.error, 'sad'); return; }
      window.showToast('투표가 마감됐어!', 'smail');
      window.openVoteView(_voteSession.sessionId);
    } catch (_) { window.showToast('마감 실패', 'sad'); }
  };

  /* ═══════════════ 유틸 ═══════════════ */

  function _esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

})();
</script>
